<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Ocean Array - Array Visualisierung (ohne Code)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow: hidden; }
        .font-code { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .val-badge {
            background-color: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-size: 13px; font-weight: bold;
        }
        
        /* Container Animations */
        .container-box { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .container-empty { border: 2px dashed #334155; background: transparent; }
        .container-elektronik { border: 2px solid #3b82f6; background: rgba(59, 130, 246, 0.2); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .container-textil { border: 2px solid #f59e0b; background: rgba(245, 158, 11, 0.2); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .container-highlight { ring: 4px solid #ef4444; transform: scale(1.1); z-index: 10; }
        
        .ship-hull { border: 4px solid #475569; border-top: none; border-radius: 0 0 20px 20px; position: relative; }
        .ship-water { border-bottom: 2px solid #0ea5e9; position: absolute; bottom: -10px; left: -20px; right: -20px; opacity: 0.5; }
    </style>
</head>

<body class="h-screen flex flex-col relative">

    <header class="bg-slate-900 border-b border-slate-800 p-4 shrink-0 shadow-md relative z-20 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-sky-400 tracking-tight">MS Ocean Array (Ablauf-Visualisierung)</h1>
        </div>
        <div class="flex gap-2 bg-slate-950 p-1 rounded-lg border border-slate-800">
            <button onclick="setMode('vorne')" id="btn-vorne" class="px-4 py-2 rounded-md text-sm font-bold bg-sky-600 text-white shadow">AuffuellenVonVorne()</button>
            <button onclick="setMode('hinten')" id="btn-hinten" class="px-4 py-2 rounded-md text-sm font-bold text-slate-400 hover:text-white">AuffuellenVonHinten()</button>
            <button onclick="setMode('tauschen')" id="btn-tauschen" class="px-4 py-2 rounded-md text-sm font-bold text-slate-400 hover:text-white">ContainerTauschen()</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-6 gap-6 bg-slate-950 relative z-10 justify-center">
        
        <!-- Visualization Column (Centered and larger now) -->
        <section class="flex-[2] bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl relative items-center justify-center p-8 max-w-5xl">
            <div class="absolute top-4 left-4 text-xs font-semibold text-slate-500 uppercase tracking-widest">Visuelle Darstellung (Heap)</div>
            
            <div class="w-full max-w-4xl mt-12">
                <div class="flex justify-between mb-2 px-2 text-slate-500 font-code text-sm">
                    <span>Index 0</span><span>Index 9</span>
                </div>
                
                <!-- The Ship -->
                <div class="ship-hull flex p-2 gap-2 h-40 items-end bg-slate-800/30" id="ship-container">
                    <!-- Containers injected by JS -->
                    <div class="ship-water"></div>
                </div>
                
                <!-- Arrow Indicators -->
                <div id="pointer-container" class="relative h-12 mt-2 w-full"></div>
            </div>
        </section>

        <!-- Memory Column -->
        <section class="flex-1 bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl max-w-[400px]">
            <div class="bg-slate-950 py-3 px-4 border-b border-slate-800">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Call Stack (Lokale Variablen)</span>
            </div>
            <div id="stack-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3"></div>
        </section>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 shrink-0 relative z-20 p-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 max-w-7xl mx-auto items-center">
            <div class="lg:col-span-2 bg-slate-950 border border-slate-800 rounded-lg p-4 min-h-[90px] flex flex-col justify-center">
                <h3 class="text-xs uppercase font-bold text-sky-400 mb-1 tracking-wider">Erklärung</h3>
                <p id="explanation-text" class="text-base text-slate-300 leading-relaxed"></p>
            </div>
            <div class="flex items-center justify-center gap-3">
                <button id="btn-prev" class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-lg disabled:opacity-30 border border-slate-700">&larr; Zurück</button>
                <div class="bg-slate-950 px-4 py-3 rounded-lg border border-slate-800 font-code text-sm">
                    <span id="step-current" class="text-sky-400 font-bold">0</span><span class="text-slate-500">/</span><span id="step-total" class="text-slate-400">0</span>
                </div>
                <button id="btn-next" class="px-5 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-lg disabled:opacity-30 font-bold border border-sky-500">Weiter &rarr;</button>
            </div>
        </div>
    </footer>

    <script>
        const ARRAY_SIZE = 10;
        const VAL_E = "Elektronik";
        const VAL_T = "Textilien";
        const VAL_L = "Leer";

        // Szenarien ohne Code-Referenzen
        const scenarios = {
            'vorne': {
                steps: [
                    { arr: [VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_E, "anzahl": 3 }, pointer: -1, desc: "Die Methode wird aufgerufen. Wir wollen 3 Elektronik-Container von vorne einladen." },
                    { arr: [VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_E, "anzahl": 3, "i": 0 }, pointer: 0, desc: "Die Schleife startet. Laufvariable <code>i = 0</code>. Prüfung: Ist 0 < 3? Ja." },
                    { arr: [VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_E, "anzahl": 3, "i": 0 }, pointer: 0, desc: "Der erste Container wird an Index 0 platziert." },
                    { arr: [VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_E, "anzahl": 3, "i": 1 }, pointer: 1, desc: "Laufvariable <code>i</code> wird um 1 erhöht (i++). Prüfung: Ist 1 < 3? Ja." },
                    { arr: [VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_E, "anzahl": 3, "i": 1 }, pointer: 1, desc: "Der zweite Container wird an Index 1 platziert." },
                    { arr: [VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_E, "anzahl": 3, "i": 2 }, pointer: 2, desc: "Laufvariable <code>i</code> wird auf 2 erhöht. Prüfung: Ist 2 < 3? Ja." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_E, "anzahl": 3, "i": 2 }, pointer: 2, desc: "Der dritte Container wird an Index 2 verladen." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_E, "anzahl": 3, "i": 3 }, pointer: -1, desc: "Laufvariable <code>i</code> wird auf 3 erhöht. Prüfung: Ist 3 < 3? Nein. Die Schleife bricht ab." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: {}, pointer: -1, desc: "Methode beendet. Das Array im Heap wurde erfolgreich verändert!" }
                ]
            },
            'hinten': {
                steps: [
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_T, "anzahl": 2 }, pointer: -1, desc: "Wir laden 2 Textil-Container von hinten ein. Das Array hat bereits Inhalt." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_T, "anzahl": 2, "i": 0 }, pointer: -1, desc: "Schleife startet mit <code>i = 0</code>." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L], stack: { "ladung": VAL_T, "anzahl": 2, "i": 0, "index": 9 }, pointer: 9, desc: "Berechnung: Länge (10) - 1 - i (0) = Index 9. Zeiger springt ganz nach hinten." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T], stack: { "ladung": VAL_T, "anzahl": 2, "i": 0, "index": 9 }, pointer: 9, desc: "Zuweisung des Textil-Containers an Index 9." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T], stack: { "ladung": VAL_T, "anzahl": 2, "i": 1 }, pointer: -1, desc: "<code>i</code> wird 1. 1 < 2 ist wahr." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T], stack: { "ladung": VAL_T, "anzahl": 2, "i": 1, "index": 8 }, pointer: 8, desc: "Berechnung: Länge (10) - 1 - i (1) = Index 8." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T,VAL_T], stack: { "ladung": VAL_T, "anzahl": 2, "i": 1, "index": 8 }, pointer: 8, desc: "Zuweisung des Textil-Containers an Index 8." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T,VAL_T], stack: { "ladung": VAL_T, "anzahl": 2, "i": 2 }, pointer: -1, desc: "<code>i</code> wird 2. 2 < 2 ist falsch. Abbruch." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T,VAL_T], stack: {}, pointer: -1, desc: "Methode beendet." }
                ]
            },
            'tauschen': {
                steps: [
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T,VAL_T], stack: { "posA": 0, "posB": 8 }, pointer: -1, p2: -1, desc: "Wir wollen den Container an Index 0 mit Index 8 tauschen." },
                    { arr: [VAL_E,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T,VAL_T], stack: { "posA": 0, "posB": 8, "temp": VAL_E }, pointer: 0, p2: -1, desc: "WICHTIG: Wir speichern den Wert von Index 0 zuerst in einer temporären Variable <code>temp</code>, sonst geht er beim Überschreiben verloren!" },
                    { arr: [VAL_T,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_T,VAL_T], stack: { "posA": 0, "posB": 8, "temp": VAL_E }, pointer: 0, p2: 8, desc: "Jetzt überschreiben wir Index 0 mit dem Wert von Index 8. Pos 0 ist nun Textilien." },
                    { arr: [VAL_T,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_E,VAL_T], stack: { "posA": 0, "posB": 8, "temp": VAL_E }, pointer: 8, p2: -1, desc: "Zum Schluss holen wir den geretteten Wert aus <code>temp</code> und schreiben ihn in Index 8. Tausch vollendet!" },
                    { arr: [VAL_T,VAL_E,VAL_E,VAL_L,VAL_L,VAL_L,VAL_L,VAL_L,VAL_E,VAL_T], stack: {}, pointer: -1, p2: -1, desc: "Methode beendet." }
                ]
            }
        };

        let currentMode = 'vorne';
        let currentStep = 0;

        function setMode(mode) {
            currentMode = mode;
            currentStep = 0;
            
            document.querySelectorAll('header button').forEach(b => {
                b.className = "px-4 py-2 rounded-md text-sm font-bold text-slate-400 hover:text-white";
            });
            document.getElementById(`btn-${mode}`).className = "px-4 py-2 rounded-md text-sm font-bold bg-sky-600 text-white shadow";
            
            render();
        }

        function render() {
            const sc = scenarios[currentMode];
            const step = sc.steps[currentStep];
            
            // UI States
            document.getElementById('btn-prev').disabled = currentStep === 0;
            document.getElementById('btn-next').disabled = currentStep === sc.steps.length - 1;
            document.getElementById('step-current').textContent = currentStep + 1;
            document.getElementById('step-total').textContent = sc.steps.length;
            document.getElementById('explanation-text').innerHTML = step.desc;

            // Stack (Memory)
            const stackHtml = Object.keys(step.stack).map(k => {
                return `<div class="flex justify-between items-center bg-slate-800/80 px-4 py-3 rounded border border-slate-700">
                    <span class="font-code text-slate-300">${k}</span>
                    <span class="val-badge">${step.stack[k]}</span>
                </div>`;
            }).join('') || '<div class="text-slate-500 text-sm italic p-2">Keine lokalen Variablen</div>';
            document.getElementById('stack-container').innerHTML = `<div class="font-bold text-sky-300 mb-2">schiff <span class="text-slate-500 font-normal text-sm">&rarr; [Array auf Heap]</span></div>` + stackHtml;

            // Array Visuals (Ship)
            let shipHtml = '';
            let pointersHtml = '';
            
            step.arr.forEach((val, idx) => {
                let boxClass = 'container-empty';
                let content = '';
                if(val === VAL_E) { boxClass = 'container-elektronik'; content = '⚡'; }
                if(val === VAL_T) { boxClass = 'container-textil'; content = '👕'; }
                
                let highlight = (step.pointer === idx || step.p2 === idx) ? 'ring-2 ring-sky-400 transform -translate-y-2' : '';
                
                shipHtml += `
                    <div class="flex-1 flex flex-col justify-end h-full relative">
                        <div class="w-full aspect-square rounded-sm container-box ${boxClass} ${highlight} flex items-center justify-center text-2xl relative z-10">
                            ${content}
                        </div>
                    </div>`;
                    
                if (step.pointer === idx || step.p2 === idx) {
                    const leftPercent = (idx / 10) * 100 + 5;
                    pointersHtml += `<div class="absolute text-sky-400 font-bold flex flex-col items-center" style="left: calc(${leftPercent}% - 10px);">
                        <svg class="w-6 h-6 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                        <span class="text-xs bg-slate-900 px-1 rounded border border-sky-400 font-code">Index ${idx}</span>
                    </div>`;
                }
            });
            
            document.getElementById('ship-container').innerHTML = shipHtml + '<div class="ship-water"></div>';
            document.getElementById('pointer-container').innerHTML = pointersHtml;
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentStep < scenarios[currentMode].steps.length - 1) { currentStep++; render(); }
        });
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentStep > 0) { currentStep--; render(); }
        });
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight') document.getElementById('btn-next').click();
            if(e.key === 'ArrowLeft') document.getElementById('btn-prev').click();
        });

        // Initialize
        render();
    </script>
</body>
</html>
