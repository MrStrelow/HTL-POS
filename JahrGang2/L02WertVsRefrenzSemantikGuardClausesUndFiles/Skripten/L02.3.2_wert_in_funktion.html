<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Call Stack Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
        }
        .font-code {
            font-family: 'Fira Code', monospace;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @keyframes pushFrame {
            0% { opacity: 0; transform: translateY(-30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .frame-push {
            animation: pushFrame 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popFrame {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.95); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .var-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .line-active {
            background-color: rgba(56, 189, 248, 0.15);
            border-left: 4px solid #38bdf8;
        }
        .line-normal {
            border-left: 4px solid transparent;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-800 p-4 shrink-0 flex items-center justify-between shadow-md z-20">
        <div>
            <h1 class="text-2xl font-bold text-sky-400 tracking-tight">Call Stack Visualizer</h1>
            <p class="text-sm text-slate-400 mt-1">Interactive C# Execution & Scope Simulation</p>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-4 gap-6 bg-slate-950">
        
        <!-- Left Panel: C# Code -->
        <section class="flex-[3] bg-slate-900 rounded-xl border border-slate-700 flex flex-col overflow-hidden shadow-2xl relative">
            <div class="bg-slate-800 py-2 px-4 border-b border-slate-700 flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                <span class="ml-2 text-xs font-semibold text-slate-400 uppercase tracking-widest">Program.cs</span>
            </div>
            <div id="code-container" class="flex-1 overflow-y-auto p-4 font-code text-sm sm:text-[15px] leading-7">
                <!-- Code injected by JS -->
            </div>
        </section>

        <!-- Right Panel: Call Stack -->
        <section class="flex-[2] min-w-[320px] bg-slate-900 rounded-xl border border-slate-700 flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-slate-800 py-2.5 px-4 border-b border-slate-700 flex justify-between items-center">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                    <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    Call Stack
                </span>
            </div>
            
            <div id="stack-container" class="flex-1 overflow-y-auto p-4 flex flex-col-reverse gap-4 bg-slate-900/50">
                <!-- Stack Frames injected by JS -->
            </div>
        </section>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 shrink-0 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.3)] z-10 p-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 max-w-[1400px] mx-auto items-center">
            
            <div class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-lg p-4 shadow-inner min-h-[80px] flex flex-col justify-center">
                <h3 class="text-xs uppercase font-bold text-sky-400 mb-1 tracking-wider">Explanation</h3>
                <p id="explanation-text" class="text-sm text-slate-300 leading-relaxed"></p>
            </div>

            <div class="flex flex-col items-center justify-center gap-3 lg:col-span-1">
                <div class="flex items-center gap-3">
                    <button id="btn-prev" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded shadow disabled:opacity-30 transition-all text-sm font-medium">
                        &larr; Prev
                    </button>
                    <div class="bg-slate-950 px-4 py-2 rounded border border-slate-700 font-code text-sm shadow-inner min-w-[90px] text-center">
                        <span id="step-current" class="text-sky-400 font-bold"></span> / <span id="step-total" class="text-slate-400"></span>
                    </div>
                    <button id="btn-next" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded shadow-lg disabled:opacity-30 transition-all text-sm font-bold">
                        Next Step &rarr;
                    </button>
                </div>
                <button id="btn-reset" class="text-xs text-slate-500 hover:text-slate-300 underline transition-colors">Reset Application</button>
            </div>
        </div>
    </footer>

    <script>
        // Bugfix: Safe HTML rendering. No dynamic regex replacement. 
        // Keywords and brackets are pre-formatted safely.
        const rawCode = [
            /* 0 */ "<span class='text-pink-400'>static</span> <span class='text-pink-400'>void</span> Main()",
            /* 1 */ "{",
            /* 2 */ "    <span class='text-pink-400'>int</span> limit = <span class='text-emerald-400'>10</span>;",
            /* 3 */ "    <span class='text-pink-400'>int</span> input = <span class='text-emerald-400'>5</span>;",
            /* 4 */ "    <span class='text-pink-400'>if</span> (input &lt; limit)",
            /* 5 */ "    {",
            /* 6 */ "        <span class='text-pink-400'>int</span> verdoppelt = Verdopple(input);",
            /* 7 */ "        <span class='text-sky-300'>Console.WriteLine</span>(verdoppelt);",
            /* 8 */ "    }",
            /* 9 */ "    <span class='text-sky-300'>Console.WriteLine</span>(<span class='text-amber-300'>\"Fertig.\"</span>);",
            /* 10*/ "}",
            /* 11*/ "",
            /* 12*/ "<span class='text-pink-400'>static</span> <span class='text-pink-400'>int</span> Verdopple(<span class='text-pink-400'>int</span> zahl)",
            /* 13*/ "{",
            /* 14*/ "    <span class='text-pink-400'>int</span> ergebnis = zahl * <span class='text-emerald-400'>2</span>;",
            /* 15*/ "    <span class='text-pink-400'>return</span> ergebnis;",
            /* 16*/ "}"
        ];

        // Define the execution steps strictly adhering to the requested flow.
        const steps = [
            {
                line: -1,
                stack: [],
                desc: "Application initialized. Call stack is currently empty. Click 'Next Step' to begin."
            },
            { // 1. Highlight Main
                line: 0,
                stack: [ { name: 'Main()', vars: {}, blockVars: {} } ],
                desc: "1. <strong>Main()</strong> is called. A new stack frame is pushed to the Call Stack."
            },
            { // 2. Highlight limit and input
                line: 3, 
                stack: [ { name: 'Main()', vars: { 'limit': '10', 'input': '5' }, blockVars: {} } ],
                desc: "2. Memory is allocated for <span class='text-emerald-400 font-code'>limit</span> and <span class='text-emerald-400 font-code'>input</span> in the Main() stack frame."
            },
            { // 3. Highlight if
                line: 4,
                stack: [ { name: 'Main()', vars: { 'limit': '10', 'input': '5' }, blockVars: {} } ],
                desc: "3. Evaluating the condition <span class='font-code text-pink-400'>if (input &lt; limit)</span>. Since 5 &lt; 10 is true, we enter the block scope."
            },
            { // 4. Highlight verdoppelt = Verdopple... PUSH
                line: 12, // Jump to function signature to show PUSH
                stack: [ 
                    { name: 'Main()', vars: { 'limit': '10', 'input': '5' }, blockVars: {} },
                    { name: 'Verdopple(int zahl)', vars: { 'zahl': '5' } }
                ],
                desc: "4. Calling <strong>Verdopple(input)</strong>. <strong class='text-amber-400'>PUSH:</strong> A new frame is added to the stack with the argument <span class='font-code'>zahl = 5</span>."
            },
            { // 5. Highlight ergebnis
                line: 14,
                stack: [ 
                    { name: 'Main()', vars: { 'limit': '10', 'input': '5' }, blockVars: {} },
                    { name: 'Verdopple(int zahl)', vars: { 'zahl': '5', 'ergebnis': '10' } }
                ],
                desc: "5. Calculating <span class='text-emerald-400 font-code'>ergebnis</span>. The local variable is added to the Verdopple() frame."
            },
            { // 6. Highlight return
                line: 15,
                stack: [ 
                    { name: 'Main()', vars: { 'limit': '10', 'input': '5' }, blockVars: {} },
                    { name: 'Verdopple(int zahl)', vars: { 'zahl': '5', 'ergebnis': '10' } }
                ],
                desc: "6. Returning the value <span class='font-code'>10</span> back to the caller."
            },
            { // 7. Back to verdoppelt = Verdopple... POP
                line: 6,
                stack: [ 
                    { name: 'Main()', vars: { 'limit': '10', 'input': '5' }, blockVars: { 'verdoppelt': '10' } }
                ],
                desc: "7. <strong class='text-rose-400'>POP:</strong> Verdopple() frame is removed! Back in Main(), the return value is stored in <span class='font-code text-emerald-400'>verdoppelt</span> (scoped to the if-block)."
            },
            { // 8. Highlight Console.WriteLine(verdoppelt)
                line: 7,
                stack: [ 
                    { name: 'Main()', vars: { 'limit': '10', 'input': '5' }, blockVars: { 'verdoppelt': '10' } }
                ],
                desc: "8. Printing the value of <span class='font-code text-emerald-400'>verdoppelt</span> (10) to the console."
            },
            { // 9. Highlight Console.WriteLine("Fertig.") - REMOVE var
                line: 9,
                stack: [ 
                    { name: 'Main()', vars: { 'limit': '10', 'input': '5' }, blockVars: {} }
                ],
                desc: "9. <strong class='text-sky-400'>SCOPE END:</strong> The if-block has ended. <span class='font-code text-emerald-400'>verdoppelt</span> is removed from the stack frame."
            },
            { // 10. End of program
                line: 10,
                stack: [],
                desc: "10. <strong class='text-rose-400'>POP:</strong> End of program. Main() frame is removed. The stack is empty."
            }
        ];

        let currentStep = 0;
        let lastStackSize = 0;

        const uiCode = document.getElementById('code-container');
        const uiStack = document.getElementById('stack-container');
        const uiDesc = document.getElementById('explanation-text');
        
        function render() {
            const step = steps[currentStep];
            
            // Update Navigation
            document.getElementById('btn-prev').disabled = currentStep === 0;
            document.getElementById('btn-next').disabled = currentStep === steps.length - 1;
            document.getElementById('step-current').textContent = currentStep;
            document.getElementById('step-total').textContent = steps.length - 1;
            uiDesc.innerHTML = step.desc;

            // Render pre-formatted safe code
            uiCode.innerHTML = '';
            rawCode.forEach((lineHtml, index) => {
                const isActive = index === step.line;
                
                const lineDiv = document.createElement('div');
                lineDiv.className = `flex px-2 py-0.5 rounded transition-colors ${isActive ? 'line-active text-sky-100' : 'line-normal text-slate-300'}`;
                
                const numSpan = document.createElement('span');
                numSpan.className = 'w-8 shrink-0 text-right text-slate-600 mr-4 select-none font-code text-xs pt-1 border-r border-slate-700 pr-2';
                numSpan.textContent = index + 1;
                
                const codeSpan = document.createElement('span');
                codeSpan.className = 'whitespace-pre font-code';
                // Safe to use innerHTML because string array is pre-escaped and hand-crafted
                codeSpan.innerHTML = isActive ? `<strong>${lineHtml}</strong>` : lineHtml;

                lineDiv.appendChild(numSpan);
                lineDiv.appendChild(codeSpan);
                uiCode.appendChild(lineDiv);
            });

            // Smooth scroll to active line
            const activeLineEl = uiCode.querySelector('.line-active');
            if(activeLineEl) activeLineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Render Stack
            uiStack.innerHTML = '';
            const isPushing = step.stack.length > lastStackSize;

            if (step.stack.length === 0) {
                uiStack.innerHTML = `
                    <div class="h-full flex items-center justify-center border-2 border-dashed border-slate-700/50 rounded-xl text-slate-500 text-sm">
                        Call Stack is empty
                    </div>`;
            } else {
                step.stack.forEach((frame, index) => {
                    const isTop = index === step.stack.length - 1;
                    const el = document.createElement('div');
                    
                    let classes = `border rounded-xl overflow-hidden bg-slate-800 transition-all `;
                    if (isTop) {
                        classes += `border-sky-500/50 shadow-[0_0_15px_rgba(56,189,248,0.15)] ring-1 ring-sky-500/20 `;
                        if (isPushing) classes += `frame-push `;
                    } else {
                        classes += `border-slate-700 opacity-70 scale-[0.98] `;
                    }
                    el.className = classes;

                    // Header
                    let html = `
                        <div class="${isTop ? 'bg-sky-500/10' : 'bg-slate-900'} px-4 py-2 border-b border-slate-700/50 flex justify-between items-center">
                            <span class="font-code font-bold ${isTop ? 'text-sky-400' : 'text-slate-400'}">${frame.name}</span>
                        </div>
                    `;

                    // Variables
                    html += `<div class="p-4 flex flex-col gap-2">`;
                    const renderVar = (name, val, isBlock) => `
                        <div class="flex justify-between items-center bg-slate-900/80 px-3 py-1.5 rounded border ${isBlock ? 'border-pink-500/30' : 'border-slate-700'} var-enter">
                            <span class="font-code text-sm text-slate-300 flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full ${isBlock ? 'bg-pink-500' : 'bg-emerald-500'}"></span>
                                ${name}
                            </span>
                            <span class="font-code text-sm font-bold text-emerald-400">${val}</span>
                        </div>
                    `;

                    const varsKeys = Object.keys(frame.vars || {});
                    if (varsKeys.length > 0) {
                        varsKeys.forEach(k => html += renderVar(k, frame.vars[k], false));
                    }

                    // Block Scoped Variables
                    if (frame.blockVars) {
                        const blockKeys = Object.keys(frame.blockVars);
                        if (blockKeys.length > 0) {
                            html += `
                                <div class="mt-2 pt-3 border-t border-dashed border-slate-700 relative">
                                    <span class="absolute -top-2.5 left-2 bg-slate-800 px-2 py-0.5 rounded text-[10px] text-pink-400 uppercase font-bold tracking-widest border border-slate-700">if-block scope</span>
                                    <div class="flex flex-col gap-2 mt-1">
                            `;
                            blockKeys.forEach(k => html += renderVar(k, frame.blockVars[k], true));
                            html += `</div></div>`;
                        }
                    }

                    if (varsKeys.length === 0 && (!frame.blockVars || Object.keys(frame.blockVars).length === 0)) {
                        html += `<span class="text-xs text-slate-500 italic">No variables allocated</span>`;
                    }

                    html += `</div>`;
                    el.innerHTML = html;
                    uiStack.appendChild(el);
                });
            }
            lastStackSize = step.stack.length;
        }

        // Event Listeners
        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentStep < steps.length - 1) { currentStep++; render(); }
        });
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentStep > 0) { currentStep--; render(); }
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            currentStep = 0; lastStackSize = 0; render();
        });
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight') document.getElementById('btn-next').click();
            if(e.key === 'ArrowLeft') document.getElementById('btn-prev').click();
        });

        // Initialize Application
        render();
    </script>
</body>
</html>
