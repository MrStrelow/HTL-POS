<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Memory Visualizer: Value Types</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }
        .font-code { font-family: 'Fira Code', monospace; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @keyframes pushFrame {
            0% { opacity: 0; transform: translateY(-20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .frame-push { animation: pushFrame 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .line-active {
            background-color: rgba(56, 189, 248, 0.15);
            border-left: 4px solid #38bdf8;
        }
        .line-normal { border-left: 4px solid transparent; }

        .val-badge {
            background-color: rgba(217, 70, 239, 0.1);
            border: 1px solid rgba(217, 70, 239, 0.3);
            color: #d946ef;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .val-badge.updated {
            animation: highlight-pulse 1s forwards;
        }

        @keyframes highlight-pulse {
            0% { background-color: #34d399; color: #022c22; transform: scale(1.1); border-color: #10b981; }
            100% { background-color: rgba(217, 70, 239, 0.1); color: #d946ef; transform: scale(1); border-color: rgba(217, 70, 239, 0.3); }
        }
    </style>
</head>

<body class="h-screen flex flex-col relative">

    <header class="bg-slate-900 border-b border-slate-800 p-4 shrink-0 shadow-md relative z-20">
        <div>
            <h1 class="text-2xl font-bold text-sky-400 tracking-tight">Wertetypen (Value Types)</h1>
            <p class="text-sm text-slate-400 mt-1">Variablen und Wertkopien direkt auf dem Call Stack</p>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-6 gap-8 bg-slate-950 relative z-10" id="main-area">
        
        <!-- Code Section -->
        <section class="flex-1 bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl relative">
            <div class="bg-slate-950 py-2 px-4 border-b border-slate-800 flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                <span class="ml-2 text-xs font-semibold text-slate-500 uppercase tracking-widest">Program.cs</span>
            </div>
            <div id="code-container" class="flex-1 overflow-y-auto p-6 font-code text-[16px] leading-8">
                <!-- Code injected by JS -->
            </div>
        </section>

        <!-- Stack Section -->
        <section class="flex-1 bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-slate-950 py-2 px-4 border-b border-slate-800">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                    <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    Call Stack
                </span>
            </div>
            <div id="stack-container" class="flex-1 overflow-y-auto p-6 flex flex-col-reverse gap-4 bg-slate-900/50">
                <!-- Stack frames injected by JS -->
            </div>
        </section>

    </main>

    <footer class="bg-slate-900 border-t border-slate-800 shrink-0 relative z-20 p-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 max-w-7xl mx-auto items-center">
            <div class="lg:col-span-2 bg-slate-950 border border-slate-800 rounded-lg p-4 min-h-[90px] flex flex-col justify-center">
                <h3 class="text-xs uppercase font-bold text-sky-400 mb-1 tracking-wider">Aktion</h3>
                <p id="explanation-text" class="text-base text-slate-300 leading-relaxed"></p>
            </div>

            <div class="flex flex-col items-center justify-center gap-3">
                <div class="flex items-center gap-3">
                    <button id="btn-prev" class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-lg shadow disabled:opacity-30 transition-all text-sm font-medium border border-slate-700">&larr; Zurück</button>
                    <div class="bg-slate-950 px-4 py-3 rounded-lg border border-slate-800 font-code text-sm min-w-[90px] text-center">
                        <span id="step-current" class="text-sky-400 font-bold"></span><span class="text-slate-500">/</span><span id="step-total" class="text-slate-400"></span>
                    </div>
                    <button id="btn-next" class="px-5 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-lg shadow-lg disabled:opacity-30 transition-all text-sm font-bold border border-sky-500">Weiter &rarr;</button>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const rawCode = [
            /* 0*/ "<span class='text-pink-400'>static void</span> <span class='text-sky-300'>Main</span>() {",
            /* 1*/ "    <span class='text-pink-400'>int</span> a = <span class='text-fuchsia-400'>45</span>;",
            /* 2*/ "    <span class='text-pink-400'>int</span> b = <span class='text-fuchsia-400'>3</span>;",
            /* 3*/ "",
            /* 4*/ "    a = b;",
            /* 5*/ "    b = <span class='text-fuchsia-400'>20</span>;",
            /* 6*/ "}"
        ];

        const steps = [
            { 
                line: -1, 
                stack: [], 
                desc: "Programm ist bereit. Drücke auf 'Weiter', um den Start zu simulieren." 
            },
            { 
                line: 0, 
                stack: [ { id: "frame-main", name: "Main()", vars: {} } ], 
                desc: "<strong>Schritt 1:</strong> <code>Main()</code> startet. Ein Stack-Frame für die Methode wird angelegt." 
            },
            { 
                line: 1, 
                stack: [ { id: "frame-main", name: "Main()", vars: { "a": { val: "45", updated: true } } } ], 
                desc: "<strong>Schritt 2:</strong> <code>int a = 45;</code><br>Da <code>int</code> ein <strong>Wertetyp</strong> (Value Type) ist, wird der eigentliche Zahlenwert direkt in der lokalen Variable auf dem Call Stack gespeichert." 
            },
            { 
                line: 2, 
                stack: [ { id: "frame-main", name: "Main()", vars: { "a": { val: "45", updated: false }, "b": { val: "3", updated: true } } } ], 
                desc: "<strong>Schritt 3:</strong> <code>int b = 3;</code><br>Eine weitere Variable entsteht direkt auf dem Stack. <code>a</code> und <code>b</code> sind zwei völlig unabhängige Speicherplätze (Boxen)." 
            },
            { 
                line: 4, 
                stack: [ { id: "frame-main", name: "Main()", vars: { "a": { val: "3", updated: true }, "b": { val: "3", updated: false } } } ], 
                desc: "<strong>Schritt 4: Wert-Kopie!</strong><br><code>a = b;</code> nimmt den <em>Wert</em> aus der Box <code>b</code> und legt eine Kopie davon in die Box <code>a</code> ab. Beide Variablen enthalten jetzt die Zahl 3." 
            },
            { 
                line: 5, 
                stack: [ { id: "frame-main", name: "Main()", vars: { "a": { val: "3", updated: false }, "b": { val: "20", updated: true } } } ], 
                desc: "<strong>Schritt 5: Kein Seiteneffekt!</strong><br><code>b = 20;</code> überschreibt den Wert in Box <code>b</code>. Da hier keine Referenzen geteilt werden, bleibt <code>a</code> absolut unberührt bei 3." 
            }
        ];

        let currentStep = 0;
        let lastStackSize = 0;

        const uiCode = document.getElementById('code-container');
        const uiStack = document.getElementById('stack-container');
        const uiDesc = document.getElementById('explanation-text');

        function formatValue(varObj) {
            const updateClass = varObj.updated ? 'updated' : '';
            return `<span class="val-badge ${updateClass}">${varObj.val}</span>`;
        }

        function render() {
            const step = steps[currentStep];
            
            document.getElementById('btn-prev').disabled = currentStep === 0;
            document.getElementById('btn-next').disabled = currentStep === steps.length - 1;
            document.getElementById('step-current').textContent = currentStep;
            document.getElementById('step-total').textContent = steps.length - 1;
            uiDesc.innerHTML = step.desc;

            // Render Code
            uiCode.innerHTML = '';
            rawCode.forEach((lineHtml, index) => {
                const isActive = index === step.line;
                const lineDiv = document.createElement('div');
                lineDiv.className = `flex px-2 py-1 rounded transition-colors ${isActive ? 'line-active text-sky-50' : 'line-normal text-slate-300'}`;
                
                const numSpan = document.createElement('span');
                numSpan.className = 'w-8 shrink-0 text-right text-slate-600 mr-4 select-none font-code text-sm pt-1.5 border-r border-slate-700/50 pr-2';
                numSpan.textContent = index + 1;
                
                const codeSpan = document.createElement('span');
                codeSpan.className = 'whitespace-pre font-code';
                codeSpan.innerHTML = isActive ? `<strong>${lineHtml}</strong>` : lineHtml;

                lineDiv.appendChild(numSpan);
                lineDiv.appendChild(codeSpan);
                uiCode.appendChild(lineDiv);
            });

            // Render Stack
            uiStack.innerHTML = '';
            const isPushing = step.stack.length > lastStackSize;

            if (step.stack.length === 0) {
                uiStack.innerHTML = `<div class="h-full flex items-center justify-center text-slate-600 text-sm italic">Call Stack leer</div>`;
            } else {
                step.stack.forEach((frame, index) => {
                    const isTop = index === 0;
                    const el = document.createElement('div');
                    
                    let classes = `border rounded-xl overflow-hidden bg-slate-800 shrink-0 relative `;
                    if (isTop) {
                        classes += `border-sky-500/50 shadow-[0_0_15px_rgba(56,189,248,0.1)] ring-1 ring-sky-500/20 z-10 `;
                        if (isPushing) classes += `frame-push `;
                    } else {
                        classes += `border-slate-700/50 opacity-70 scale-[0.98] `;
                    }
                    el.className = classes;
                    el.id = `stack-${frame.id}`;

                    let html = `
                        <div class="${isTop ? 'bg-sky-500/10' : 'bg-slate-900'} px-5 py-3 border-b border-slate-700/50 flex justify-between items-center">
                            <span class="font-code font-bold text-lg ${isTop ? 'text-sky-300' : 'text-slate-400'}">${frame.name}</span>
                        </div>
                        <div class="p-5 flex flex-col gap-4">
                    `;

                    const varsKeys = Object.keys(frame.vars || {});
                    if (varsKeys.length > 0) {
                        varsKeys.forEach(k => {
                            html += `
                            <div class="flex justify-between items-center bg-slate-950/50 px-5 py-4 rounded border border-slate-700/50 relative">
                                <span class="font-code text-lg text-slate-300"><span class="text-pink-400 text-sm mr-2">int</span><span class="text-white">${k}</span></span>
                                ${formatValue(frame.vars[k])}
                            </div>`;
                        });
                    } else {
                        html += `<span class="text-sm text-slate-500 italic">Keine Variablen deklariert</span>`;
                    }

                    html += `</div>`;
                    el.innerHTML = html;
                    uiStack.appendChild(el);
                });
            }
            lastStackSize = step.stack.length;
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentStep < steps.length - 1) { currentStep++; render(); }
        });
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentStep > 0) { currentStep--; render(); }
        });
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight') document.getElementById('btn-next').click();
            if(e.key === 'ArrowLeft') document.getElementById('btn-prev').click();
        });

        // Init
        render();
    </script>
</body>
</html>
