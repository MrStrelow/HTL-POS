<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klassen und Objekte</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020617; --panel: #0f172a; --panel2: #1e293b; --line: #334155;
    --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --x: #f59e0b; --y: #a855f7;
    --ok: #10b981; --bad: #ef4444; --kw: #c084fc; --str: #fbbf24; --num: #34d399; --com: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
  .mono { font-family: 'Fira Code', monospace; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 19px; color: var(--accent); }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  #tabs button { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  #tabs button.active { background: #0284c7; color: #fff; border-color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; overflow: hidden; min-height: 0; }
  #titlebar { display: flex; align-items: baseline; gap: 12px; }
  #title { font-size: 22px; font-weight: 700; margin: 0; }
  #counter { color: var(--muted); font-size: 13px; }
  #content { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .panehead { background: #020617; border-bottom: 1px solid var(--line); padding: 6px 14px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #left { width: 40%; }
  #right { width: 60%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #codebox { flex: 1; overflow: auto; padding: 10px 0; font-size: 15px; line-height: 1.7; }
  #stage { flex: 1.9; min-height: 0; background: radial-gradient(circle at center, #0b1430 0%, #020617 75%); display: flex; align-items: center; justify-content: center; position: relative; overflow: auto; padding: 16px; }
  #text { flex: 1; min-height: 0; overflow: auto; padding: 10px 16px; font-size: 15px; line-height: 1.55; }
  #text p { margin: 6px 0; }
  #text code { font-family: 'Fira Code', monospace; background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .cl { padding: 0 14px; border-left: 4px solid transparent; white-space: pre; }
  .cl.hl { background: rgba(56,189,248,.18); border-left-color: var(--accent); }
  .cl.blink { animation: blink .5s ease 2; border-left-color: var(--x); }
  @keyframes blink { 0%, 100% { background: rgba(56,189,248,.18); } 50% { background: rgba(245,158,11,.6); } }
  .tk-kw { color: var(--kw); } .tk-str { color: var(--str); } .tk-num { color: var(--num); } .tk-com { color: var(--com); font-style: italic; } .tk-ty { color: #38bdf8; }
  nav { display: flex; gap: 8px; align-items: center; justify-content: center; }
  nav button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 18px; font-size: 15px; cursor: pointer; }
  nav button:hover { border-color: var(--accent); }
  nav button:disabled { opacity: .35; cursor: default; }
  nav button#autoBtn:not(:disabled) { border-color: var(--ok); color: var(--ok); }
  .brow { display: flex; align-items: center; gap: 10px; }
  .brow .lbl { min-width: 150px; text-align: right; font-size: 13px; color: var(--muted); }
  .bgrp { display: inline-flex; flex-direction: column; align-items: center; margin: 0 4px; gap: 2px; }
  .bgrp .bb { display: flex; gap: 1px; }
  .bit { font-family: 'Fira Code', monospace; font-size: 14px; width: 16px; text-align: center; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
  .bit.p { color: #a855f7; border-color: #a855f7; } .bit.o { color: #f59e0b; border-color: #f59e0b; } .bit.g { color: #475569; border-style: dashed; } .bit.k { color: #38bdf8; border-color: #38bdf8; } .bit.r { color: #ef4444; border-color: #ef4444; background: rgba(239,68,68,.15); }
  .bgrp .hx { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; color: var(--text); }
  .hexcheat { display: grid; grid-template-columns: repeat(8, auto); gap: 2px 10px; font-family: 'Fira Code', monospace; font-size: 12px; color: var(--muted); }
  .hexcheat b { color: var(--accent); }
  .ptr { outline: 3px solid var(--accent); outline-offset: 2px; }
  nav span { color: var(--muted); font-size: 12px; }

  .col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .label { color: var(--muted); font-size: 14px; }
  .arr { display: flex; gap: 4px; }
  .cell { width: 54px; height: 54px; border: 2px solid var(--line); border-radius: 8px; background: var(--panel); display: flex; align-items: center; justify-content: center; font-size: 26px; position: relative; transition: all .45s cubic-bezier(.2,.8,.3,1.2); }
  .cell.small { width: 44px; height: 44px; font-size: 22px; }
  .cell.txt { width: auto; min-width: 92px; padding: 0 8px; font-size: 13px; font-family: 'Fira Code', monospace; }
  .cell.null { color: var(--com); font-size: 12px; font-family: 'Fira Code', monospace; }
  .cell.hot { border-color: var(--ok); background: rgba(16,185,129,.25); transform: scale(1.08); }
  .cell.rowhot { border-color: var(--y); background: rgba(168,85,247,.18); }
  .cell.colhot { border-color: var(--x); background: rgba(245,158,11,.18); }
  .cell.both { border-color: var(--ok); background: rgba(16,185,129,.35); }
  .cell.dim { opacity: .3; }
  .idx { font-family: 'Fira Code', monospace; font-size: 12px; color: var(--muted); text-align: center; }
  .idx.x { color: var(--x); } .idx.y { color: var(--y); }
  .grid { display: grid; gap: 4px; }
  .pop { animation: pop .45s cubic-bezier(.2,.8,.3,1.3) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  .fade { animation: fade .6s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .stack { display: flex; flex-direction: column; gap: 26px; transition: gap .8s ease; }
  .stack.merged { gap: 4px; }
  .stack .tag { font-family: 'Fira Code', monospace; font-size: 13px; color: var(--muted); width: 70px; text-align: right; transition: opacity .5s; }
  .stack.merged .tag { opacity: 0; }
  .frame { border: 2px dashed transparent; border-radius: 12px; padding: 8px; transition: border-color .8s; }
  .frame.on { border-color: var(--accent); }
  .pill { font-family: 'Fira Code', monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 15px; }
  .pill.x { border-color: var(--x); color: var(--x); } .pill.y { border-color: var(--y); color: var(--y); } .pill.ok { border-color: var(--ok); color: var(--ok); } .pill.bad { border-color: var(--bad); color: var(--bad); }
  .file { background: #0b1220; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 22px; line-height: 1.35; }
  .file .ln { display: flex; gap: 12px; align-items: center; border-radius: 6px; padding: 0 6px; transition: background .3s; }
  .file .ln b { font-size: 12px; color: var(--muted); width: 18px; }
  .file .ln.hl { background: rgba(245,158,11,.18); }
  .ch { display: inline-block; border-radius: 4px; transition: background .2s; }
  .ch.hl { background: rgba(16,185,129,.45); outline: 2px solid var(--ok); }
  .table th { font-size: 12px; color: var(--x); font-family: 'Fira Code', monospace; font-weight: 600; padding: 2px 4px; }
  .table td.ri { font-size: 12px; color: var(--y); font-family: 'Fira Code', monospace; padding-right: 6px; }
  table.uni { border-collapse: collapse; font-family: 'Fira Code', monospace; font-size: 14px; }
  table.uni th, table.uni td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; }
  table.uni th { color: var(--muted); font-weight: 500; font-size: 12px; }
  table.uni td.big { font-size: 26px; }
  .unit { font-family: 'Fira Code', monospace; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 2px solid var(--line); background: var(--panel); transition: all .3s; }
  .unit.hi { border-color: var(--y); color: #e9d5ff; } .unit.lo { border-color: var(--x); color: #fde68a; } .unit.bmp { border-color: var(--ok); color: #a7f3d0; }
  .unit.sel { background: rgba(239,68,68,.35); border-color: var(--bad); transform: translateY(-6px); }
  .bits { font-family: 'Fira Code', monospace; font-size: 17px; letter-spacing: 1px; }
  .chip { font-family: 'Fira Code', monospace; font-size: 15px; padding: 4px 8px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); transition: opacity .4s; }
  .warn { color: var(--x); }

  /* ---- L05: Klassen & Objekte ---- */
  .obj { background: var(--panel2); border: 2px solid var(--ok); border-radius: 10px; min-width: 210px; overflow: hidden; transition: box-shadow .4s; }
  .obj.glow { box-shadow: 0 0 0 3px rgba(16,185,129,.35), 0 0 24px rgba(16,185,129,.35); }
  .objhead { background: rgba(16,185,129,.18); padding: 6px 12px; font-weight: 600; text-align: center; }
  .frow { display: flex; gap: 8px; padding: 4px 12px; font-size: 15px; }
  .frow .fn { color: var(--x); min-width: 72px; } .frow .eq { color: var(--muted); }
  .fv { border-radius: 4px; padding: 0 4px; transition: background .3s; }
  .fv.flash { animation: flash 1s ease; } @keyframes flash { 0% { background: rgba(245,158,11,.8); } 100% { background: transparent; } }
  .fv.read { outline: 2px solid var(--accent); background: rgba(56,189,248,.25); }
  .fv.bad { outline: 2px solid var(--bad); background: rgba(239,68,68,.25); }
  .cls { background: var(--panel2); border: 2px solid var(--accent); border-radius: 10px; min-width: 280px; overflow: hidden; }
  .clshead { background: rgba(56,189,248,.2); padding: 8px 12px; font-weight: 700; text-align: center; font-size: 17px; }
  .clssec { border-top: 1px solid var(--line); padding: 6px 12px; font-size: 14px; line-height: 1.6; transition: background .4s; }
  .clssec.on { background: rgba(245,158,11,.22); }
  .var { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--panel); border: 2px dashed var(--y); border-radius: 8px; padding: 8px 12px; }
  .var .vn { color: var(--y); font-size: 14px; } .var .vref { font-size: 20px; color: var(--accent); }
  .arrow { display: flex; flex-direction: column; align-items: center; color: var(--accent); font-size: 13px; transition: opacity .5s; }
  .arrow b { font-weight: 400; letter-spacing: -2px; font-size: 16px; }
  .arrow.hat { color: var(--x); }
  .arrow.pulse b { animation: pulse .6s ease 3; } @keyframes pulse { 50% { color: #fff; text-shadow: 0 0 8px var(--x); } }
  .bucket { border: 2px dashed; border-radius: 10px; min-width: 190px; min-height: 120px; padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .bucket .bh { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .selfarrow { color: var(--x); font-size: 14px; }
  .console { background: #000; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 60px; min-width: 210px; font-size: 13px; color: #d1fae5; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🐹 Klassen und Objekte: vom Bauplan zum Hamster</h1>
    <p>Weiter: Pfeiltasten ← → oder Leertaste · Klasse, Objekt, Felder, Konstruktor, Methoden, new, hat-Beziehung</p>
  </div>
  <div id="tabs"></div>
</header>
<main>
  <div id="titlebar"><h2 id="title"></h2><span id="counter"></span></div>
  <div id="content">
    <section id="left" class="pane"><div class="panehead">📄 Code</div><div id="codebox" class="mono"></div></section>
    <div id="right">
      <section class="pane" style="flex:1.9"><div class="panehead">🎬 Animation</div><div id="stage"></div></section>
      <section class="pane" style="flex:1"><div class="panehead">💡 Erklärung</div><div id="text"></div></section>
    </div>
  </div>
  <nav>
    <button onclick="go(-1)">◀ zurück</button>
    <button onclick="replay()">↻ nochmal</button>
    <button onclick="go(1)">weiter ▶</button>
    <button id="autoBtn" onclick="runAuto()" disabled>⏩ automatisch</button>
    <span>Taste R = Animation wiederholen</span>
  </nav>
</main>

<script>
// ===================== kleine Helfer =====================
const $ = (id) => document.getElementById(id);
let timers = [];
function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
function every(ms, fn) { timers.push(setInterval(fn, ms)); }
function clearTimers() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
const hex = (n, w) => n.toString(16).toUpperCase().padStart(w || 4, '0');

function highlight(line) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(\b(?:new|for|while|if|else|return|int|string|double|bool|void|char|class|public|private|this|null)\b)|(\b(?:File|Console|Random|Hamster)\b)|(\b\d+\b)/g;
  let out = '', last = 0, m;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  while ((m = re.exec(line)) !== null) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? 'tk-com' : m[2] ? 'tk-str' : m[3] ? 'tk-kw' : m[4] ? 'tk-ty' : 'tk-num';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
function renderCode(lines, hl) {
  const box = $('codebox'); box.innerHTML = '';
  (lines || []).forEach((l, i) => {
    const d = el('div', 'cl' + ((hl || []).includes(i) ? ' hl' : ''), highlight(l) || ' ');
    d.id = 'code-' + i; box.appendChild(d);
  });
}
function setHl(hl) { document.querySelectorAll('.cl').forEach((d, i) => { d.classList.toggle('hl', hl.includes(i)); if (!hl.includes(i)) d.classList.remove('blink'); }); }
// Schleifenkopf blinkt, wenn die Schleife (weiter)laeuft
function blink(i) { const d = $('code-' + i); if (!d) return; d.classList.add('hl'); d.classList.remove('blink'); void d.offsetWidth; d.classList.add('blink'); }

function arr1D(values, opts = {}) {
  const wrap = el('div', 'col'); wrap.style.gap = '6px';
  const a = el('div', 'arr'), idx = el('div', 'arr');
  const w = opts.txt ? 92 : opts.small ? 44 : 54;
  values.forEach((v, i) => {
    const c = el('div', 'cell' + (opts.small ? ' small' : '') + (opts.txt ? ' txt' : '') + (v === null ? ' null' : ''), v === null ? 'null' : v);
    if (opts.pop) { c.classList.add('pop'); c.style.animationDelay = (i * 0.12) + 's'; }
    c.id = (opts.id || 'a') + '-' + i; a.appendChild(c);
    const ix = el('div', 'idx ' + (opts.idxCls || 'x'), '[' + i + ']'); ix.style.width = w + 'px'; ix.style.minWidth = w + 'px'; idx.appendChild(ix);
  });
  wrap.appendChild(a); if (!opts.noIdx) wrap.appendChild(idx);
  return wrap;
}
function grid2D(data, opts = {}) {
  const rows = data.length, cols = data[0].length;
  const g = el('div', 'grid');
  g.style.gridTemplateColumns = `40px repeat(${cols}, auto)`;
  g.appendChild(el('div'));
  for (let x = 0; x < cols; x++) g.appendChild(el('div', 'idx x', String(x)));
  for (let y = 0; y < rows; y++) {
    const ri = el('div', 'idx y', String(y)); ri.style.alignSelf = 'center'; g.appendChild(ri);
    for (let x = 0; x < cols; x++) {
      const v = data[y][x];
      const c = el('div', 'cell' + (opts.small ? ' small' : '') + (opts.txt ? ' txt' : '') + (v === null ? ' null' : ''), v === null ? 'null' : v);
      c.id = (opts.id || 'g') + '-' + y + '-' + x;
      if (opts.pop) { c.classList.add('pop'); c.style.animationDelay = ((y * cols + x) * 0.04) + 's'; }
      g.appendChild(c);
    }
  }
  return g;
}
function cell(id, y, x) { return $(id + '-' + y + '-' + x); }
function setCell(c, v) { if (!c) return; c.classList.remove('null'); c.innerHTML = v; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
function clearHot() { document.querySelectorAll('#stage .cell.hot').forEach(e => e.classList.remove('hot')); }

// ===================== Daten =====================
const DIRS = ['N', 'O', 'S', 'W'];
const ARROW = { N: '⬆️', O: '➡️', S: '⬇️', W: '⬅️', '': '·' };
const DELTA = { N: [0, -1], O: [1, 0], S: [0, 1], W: [-1, 0] };
let seed = 7;
function rnd(n) { seed = (seed * 1103515245 + 12345) % 2147483648; return seed % n; }

function objCard(id, name, fields, opts = {}) {
  const c = el('div', 'obj' + (opts.pop ? ' pop' : '') + (opts.cls ? ' ' + opts.cls : ''));
  c.id = id;
  c.appendChild(el('div', 'objhead mono', `<u>${name}</u> : Hamster`));
  fields.forEach(([f, v]) => {
    const r = el('div', 'frow mono');
    r.innerHTML = `<span class="fn">${f}</span><span class="eq">=</span><span class="fv" id="${id}-${f}">${v}</span>`;
    c.appendChild(r);
  });
  return c;
}
function setField(id, f, v) { const e = $(id + '-' + f); if (!e) return; e.innerHTML = v; e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }
function classBox(opts = {}) {
  const b = el('div', 'cls' + (opts.pop ? ' pop' : '')); b.id = 'cls';
  b.appendChild(el('div', 'clshead mono', 'Hamster'));
  const f = el('div', 'clssec mono'); f.id = 'cls-f';
  f.innerHTML = '+ position : (int x, int y)<br>+ richtung : string<br>+ freund : Hamster';
  const k = el('div', 'clssec mono'); k.id = 'cls-k';
  k.innerHTML = '+ Hamster(start)';
  const m = el('div', 'clssec mono'); m.id = 'cls-m';
  m.innerHTML = '+ Bewegen(richtung : string)<br>+ Nachmachen()';
  b.appendChild(f); b.appendChild(k); b.appendChild(m);
  return b;
}
function varBox(name, id) {
  const v = el('div', 'var mono'); v.id = id;
  v.innerHTML = `<span class="vn">Hamster ${name}</span><span class="vref" id="${id}-ref">?</span>`;
  return v;
}
function arrowEl(label, id, cls) { const a = el('div', 'arrow mono ' + (cls || ''), `<span>${label}</span><b>──────▶</b>`); if (id) a.id = id; return a; }

function wiese(n, id) {
  const g = el('div', 'grid'); g.id = id;
  g.style.gridTemplateColumns = `repeat(${n}, auto)`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const c = el('div', 'cell small', '🟩'); c.id = id + '-' + y + '-' + x; g.appendChild(c); }
  return g;
}
function drawHamsters(id, p, w, n) {
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const c = $(id + '-' + y + '-' + x); if (c) { c.innerHTML = '🟩'; c.classList.remove('hot'); } }
  const cp = $(id + '-' + p[1] + '-' + p[0]); if (cp) cp.innerHTML = '🐹';
  const cw = $(id + '-' + w[1] + '-' + w[0]); if (cw) cw.innerHTML = (p[0] === w[0] && p[1] === w[1]) ? '🐹' : '🐭';
}
function clampMove(pos, d, n) { const nx = pos[0] + DELTA[d][0], ny = pos[1] + DELTA[d][1]; return [Math.max(0, Math.min(n - 1, nx)), Math.max(0, Math.min(n - 1, ny))]; }

// ===================== Code =====================
const codeKlasse = [
  'class Hamster',
  '{',
  '    // Felder: der Zustand',
  '    public (int x, int y) position;',
  '    public string richtung;',
  '    public Hamster freund;',
  '',
  '    // Konstruktor: der Startzustand',
  '    public Hamster((int x, int y) start)',
  '    {',
  '        position = start;',
  '    }',
  '',
  '    // Methoden: das Verhalten',
  '    public void Bewegen(string richtung)',
  '    {',
  '        this.richtung = richtung;',
  '    }',
  '',
  '    public void Nachmachen()',
  '    {',
  '        Bewegen(freund.richtung);',
  '    }',
  '}'
];
const codeNew = [
  'Hamster paul  = new Hamster((0, 0));',
  'Hamster willi = new Hamster((1, 0));',
  '',
  '// new  ->  Platz im Speicher + Konstruktor',
  '// paul ->  Referenz auf das Objekt'
];
const codePunkt = [
  'Hamster paul  = new Hamster((0, 0));',
  'Hamster willi = new Hamster((1, 0));',
  '',
  'paul.Bewegen("N");',

// ===================== Navigation =====================
let cur = 0, ctrl = null;
function stepper(n, step, delay) {
  let i = 0;
  return {
    next() { if (i >= n) return false; clearTimers(); step(i); i++; return true; },
    auto() { const tick = () => { if (this.next()) timers.push(setTimeout(tick, delay)); }; tick(); }
  };
}
function buildTabs() {
  chapters.forEach((c, i) => {
    const b = el('button', '', (i + 1) + '. ' + c);
    b.onclick = () => show(steps.findIndex(s => s.ch === i));
    $('tabs').appendChild(b);
  });
}
function show(i) {
  clearTimers();
  cur = Math.max(0, Math.min(steps.length - 1, i));
  const s = steps[cur];
  document.querySelectorAll('#tabs button').forEach((b, k) => b.classList.toggle('active', k === s.ch));
  $('title').textContent = s.title;
  $('counter').textContent = `Schritt ${cur + 1} / ${steps.length}`;
  $('text').innerHTML = s.text;
  renderCode(s.code, s.hl);
  const st = $('stage'); st.innerHTML = '';
  ctrl = s.render(st) || null;
  $("autoBtn").disabled = !(ctrl && ctrl.auto);
}
function go(d) { if (d > 0 && ctrl && ctrl.next && ctrl.next()) return; show(cur + d); }
function runAuto() { if (ctrl && ctrl.auto) { $("autoBtn").disabled = true; ctrl.auto(); } }
function replay() { show(cur); }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  if (e.key === 'r' || e.key === 'R') replay();
});
buildTabs();
show(0);
</script>
</body>
</html>
