<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zufallszahlen</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020617; --panel: #0f172a; --panel2: #1e293b; --line: #334155;
    --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --x: #f59e0b; --y: #a855f7;
    --ok: #10b981; --bad: #ef4444; --kw: #c084fc; --str: #fbbf24; --num: #34d399; --com: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
  .mono { font-family: 'Fira Code', monospace; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 19px; color: var(--accent); }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  #tabs button { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  #tabs button.active { background: #0284c7; color: #fff; border-color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; overflow: hidden; min-height: 0; }
  #titlebar { display: flex; align-items: baseline; gap: 12px; }
  #title { font-size: 22px; font-weight: 700; margin: 0; }
  #counter { color: var(--muted); font-size: 13px; }
  #content { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .panehead { background: #020617; border-bottom: 1px solid var(--line); padding: 6px 14px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #left { width: 40%; }
  #right { width: 60%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #codebox { flex: 1; overflow: auto; padding: 4px 0 10px; font-size: 14px; line-height: 1.6; }
  .sec { margin: 8px 10px 4px; padding: 3px 8px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 6px; }
  .sec.own { color: var(--x); background: rgba(245,158,11,.1); }
  .sec.rnd { color: var(--ok); background: rgba(16,185,129,.1); }
  #stage { flex: 1; min-height: 0; background: radial-gradient(circle at center, #0b1430 0%, #020617 75%); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 10px; }
  #text { flex: 1; min-height: 0; overflow: auto; padding: 10px 16px; font-size: 15px; line-height: 1.55; }
  #text p { margin: 6px 0; }
  #text code { font-family: 'Fira Code', monospace; background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .cl { padding: 0 14px; border-left: 4px solid transparent; white-space: pre; }
  .cl.hl { background: rgba(56,189,248,.18); border-left-color: var(--accent); }
  .cl.blink { animation: blink .5s ease 2; border-left-color: var(--x); }
  @keyframes blink { 0%, 100% { background: rgba(56,189,248,.18); } 50% { background: rgba(245,158,11,.6); } }
  .tk-kw { color: var(--kw); } .tk-str { color: var(--str); } .tk-num { color: var(--num); } .tk-com { color: var(--com); font-style: italic; } .tk-ty { color: #38bdf8; }
  nav { display: flex; gap: 8px; align-items: center; justify-content: center; }
  nav button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 18px; font-size: 15px; cursor: pointer; }
  nav button:hover { border-color: var(--accent); }
  nav button:disabled { opacity: .35; cursor: default; }
  nav button#autoBtn:not(:disabled) { border-color: var(--ok); color: var(--ok); }
  nav span { color: var(--muted); font-size: 12px; }

  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; min-width: 230px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .card p { margin: 4px 0; font-size: 14px; color: var(--muted); }
  .pill { font-family: 'Fira Code', monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 14px; }
  .pill.ok { border-color: var(--ok); color: var(--ok); } .pill.x { border-color: var(--x); color: var(--x); } .pill.y { border-color: var(--y); color: var(--y); } .pill.bad { border-color: var(--bad); color: var(--bad); }
  .seq { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
  .num { font-family: 'Fira Code', monospace; min-width: 32px; height: 28px; padding: 0 6px; border-radius: 7px; border: 2px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .num.same { border-color: var(--y); } .num.diff { border-color: var(--x); } .num.ok { border-color: var(--ok); } .num.bad { border-color: var(--bad); }
  table.lcg { border-collapse: collapse; font-family: 'Fira Code', monospace; font-size: 13px; margin-top: 6px; }
  table.lcg th, table.lcg td { border: 1px solid var(--line); padding: 2px 9px; text-align: center; }
  table.lcg th { color: var(--muted); font-weight: 500; }
  table.lcg td.res { color: var(--ok); font-weight: 700; }
  table.par { border-collapse: collapse; font-size: 14px; max-width: 100%; }
  table.par th, table.par td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  table.par th { color: var(--muted); font-weight: 600; font-size: 12px; background: #020617; }
  table.par td:first-child { font-family: 'Fira Code', monospace; font-size: 18px; text-align: center; font-weight: 700; }
  .pop { animation: pop .45s cubic-bezier(.2,.8,.3,1.3) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  .fade { animation: fade .6s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .warn { color: var(--x); }
  svg text { font-family: 'Fira Code', monospace; }
  .draw { transition: stroke-dashoffset .6s ease; }
  .bar { display: flex; height: 46px; width: 520px; max-width: 90%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .bar div { display: flex; align-items: center; justify-content: center; font-family: 'Fira Code', monospace; font-size: 13px; color: #0b1220; font-weight: 700; }
  .hint { font-size: 13px; color: var(--ok); }
  .px { display: grid; gap: 1px; background: #334155; border: 1px solid #334155; position: relative; }
  .px div { width: 12px; height: 12px; }
  .lab { display: grid; grid-template-columns: auto auto; gap: 6px 10px; align-items: center; font-family: 'Fira Code', monospace; font-size: 14px; }
  .lab input { width: 70px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-family: 'Fira Code', monospace; font-size: 14px; }
  .cond { font-size: 13px; line-height: 1.7; }
  .cond .y { color: var(--ok); } .cond .n { color: var(--bad); }
  a.jump { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .pixel { width: 54px; height: 54px; border-radius: 8px; border: 2px solid #94a3b8; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Zufallszahlen: Wie würfelt ein Computer?</h1>
    <p>Weiter: Pfeiltasten ← → oder Leertaste · Linearer Kongruenzgenerator, Seed, <code class="mono">Random</code> in C#</p>
  </div>
  <div id="tabs"></div>
</header>
<main>
  <div id="titlebar"><h2 id="title"></h2><span id="counter"></span></div>
  <div id="content">
    <section id="left" class="pane"><div class="panehead">📄 Code</div><div id="codebox" class="mono"></div></section>
    <div id="right">
      <section class="pane" style="flex:2"><div class="panehead">🎬 Animation</div><div id="stage"></div></section>
      <section class="pane" style="flex:1"><div class="panehead">💡 Erklärung</div><div id="text"></div></section>
    </div>
  </div>
  <nav>
    <button onclick="go(-1)">◀ zurück</button>
    <button onclick="replay()">↻ nochmal</button>
    <button onclick="go(1)">weiter ▶</button>
    <button onclick="toChapterEnd()" title="zur letzten Folie dieses Kapitels">⏭ Kapitelende</button>
    <button id="autoBtn" onclick="runAuto()" disabled>⏩ automatisch</button>
    <span>Bei Folien mit Einzelschritten macht → einen Schritt · R = von vorne</span>
  </nav>
</main>

<script>
// ===================== Helfer =====================
const $ = (id) => document.getElementById(id);
let timers = [];
function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
function every(ms, fn) { timers.push(setInterval(fn, ms)); }
function clearTimers() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

function svgBox(w, h) { return sv('svg', { viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: 'xMidYMid meet' }); }
// Groesse relativ zur Buehne
function fit(svg, wFrac, hFrac) {
  const st = $('stage');
  svg.style.width = Math.floor((st.clientWidth - 24) * (wFrac || 1)) + 'px';
  svg.style.height = Math.floor((st.clientHeight - 24) * (hFrac || 1)) + 'px';
}
function drawLine(parent, x1, y1, x2, y2, attrs = {}) {
  const l = sv('line', Object.assign({ x1, y1, x2, y2, stroke: '#38bdf8', 'stroke-width': 2 }, attrs), parent);
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  l.style.strokeDasharray = len; l.style.strokeDashoffset = len; l.classList.add('draw');
  requestAnimationFrame(() => requestAnimationFrame(() => l.style.strokeDashoffset = 0));
  return l;
}
function drawPath(parent, d, attrs = {}) {
  const p = sv('path', Object.assign({ d, fill: 'none', stroke: '#10b981', 'stroke-width': 2 }, attrs), parent);
  const len = p.getTotalLength ? p.getTotalLength() : 500;
  p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.style.transition = 'stroke-dashoffset .8s ease';
  requestAnimationFrame(() => requestAnimationFrame(() => p.style.strokeDashoffset = 0));
  return p;
}
function arrowDefs(svg) {
  const d = sv('defs', {}, svg);
  [['ah-x', '#f59e0b'], ['ah-y', '#a855f7'], ['ah-ok', '#10b981'], ['ah-b', '#38bdf8']].forEach(([id, c]) => {
    const m = sv('marker', { id, viewBox: '0 0 10 10', markerWidth: 3.2, markerHeight: 3.2, refX: 8, refY: 5, orient: 'auto' }, d);
    sv('path', { d: 'M0,0 L10,5 L0,10 z', fill: c }, m);
  });
}
// alte Schritte: Pfeilspitzen weg, Linien bleiben duenn und blass stehen
function fadeOld(g) { g.querySelectorAll('[marker-end]').forEach(e => e.removeAttribute('marker-end')); g.querySelectorAll('line, path').forEach(e => { e.setAttribute('stroke-width', 1.3); e.style.opacity = .45; }); g.querySelectorAll('text').forEach(e => e.style.opacity = .4); }

function highlight(line) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(\b(?:new|for|while|if|else|return|int|long|string|double|bool|void|break)\b)|(\b(?:Random|Console|Math)\b)|(\b\d+(?:\.\d+)?\b)/g;
  let out = '', last = 0, m;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  while ((m = re.exec(line)) !== null) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? 'tk-com' : m[2] ? 'tk-str' : m[3] ? 'tk-kw' : m[4] ? 'tk-ty' : 'tk-num';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
function renderCode(s) {
  const box = $('codebox'); box.innerHTML = '';
  const part = (title, cls, lines, key) => {
    if (!lines || !lines.length) return;
    box.appendChild(el('div', 'sec ' + cls, title));
    lines.forEach((l, i) => { const d = el('div', 'cl', highlight(l) || ' '); d.id = `code-${key}-${i}`; box.appendChild(d); });
  };
  part(s.ownTitle || '✍️ selbst programmiert', 'own', s.own, 'o');
  part(s.rndTitle || '🎲 mit der Random-Klasse', 'rnd', s.rnd, 'r');
  setHl(s.hl || {});
}
function setHl(h) {
  document.querySelectorAll('.cl').forEach(d => {
    const [, key, i] = d.id.split('-');
    const on = (h[key] || []).includes(+i);
    d.classList.toggle('hl', on); if (!on) d.classList.remove('blink');
  });
}
function blink(key, i) { const d = $(`code-${key}-${i}`); if (!d) return; d.classList.add('hl'); d.classList.remove('blink'); void d.offsetWidth; d.classList.add('blink'); }

function lcgF(f, seed, n) { const o = []; let x = seed; for (let i = 0; i < n; i++) { x = f(x); o.push(x); } return o.join(' ') + ' ...'; }
function lcg(k, d, m, seed, n) { const out = []; let x = seed; for (let i = 0; i < n; i++) { x = (k * x + d) % m; out.push(x); } return out; }

// Kreis mit m Positionen (wie eine Uhr)
function circle(m, opts = {}) {
  const size = opts.size || 300, r = size / 2 - 26, cx = size / 2, cy = size / 2;
  const dotR = Math.min(12, Math.PI * r / m - 2);
  const svg = svgBox(size, size);
  sv('circle', { cx, cy, r, fill: 'none', stroke: '#334155', 'stroke-width': 2 }, svg);
  const chords = sv('g', {}, svg);
  const pos = [];
  for (let i = 0; i < m; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / m;
    const p = { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; pos.push(p);
    sv('circle', { cx: p.x, cy: p.y, r: dotR, fill: '#0f172a', stroke: '#475569', 'stroke-width': 2, id: (opts.id || 'c') + '-dot-' + i }, svg);
    txt(svg, p.x, p.y + 4, String(i), { 'text-anchor': 'middle', fill: '#e2e8f0', 'font-size': Math.min(11, dotR) });
  }
  const top = sv('g', {}, svg);
  return { svg, pos, chords, top, id: opts.id || 'c', cx, cy, r, m };
}
function lightDot(c, i, color) { const d = document.getElementById(c.id + '-dot-' + i); if (d) { d.setAttribute('fill', color); d.setAttribute('stroke', color); } }
function chord(c, a, b, color, width) { const p = c.pos[a], q = c.pos[b]; return drawLine(c.chords, p.x, p.y, q.x, q.y, { stroke: color || '#38bdf8', 'stroke-width': width || 2, opacity: .85 }); }
function angPos(c, t) { const a = -Math.PI / 2 + t * 2 * Math.PI / c.m; return { x: c.cx + c.r * Math.cos(a), y: c.cy + c.r * Math.sin(a) }; }

// Graph f(x) = 5x + 3 fuer den LCG mit Streifen (je 16 = eine Runde) - flach wie auf Folie 2
function lcgGraph(W, H, opts = {}) {
  const pad = 34, top = 10, bottom = H - 24, right = opts.labels ? 70 : 8;
  const X = v => pad + v / 16 * (W - pad - right), Y = v => bottom - v / 80 * (bottom - top);
  const svg = svgBox(W, H); arrowDefs(svg);
  const id = opts.id || 'gr';
  const bandCol = ['#0b1430', '#111c38'];
  for (let b = 0; b < 5; b++) {
    sv('rect', { x: pad, y: Y((b + 1) * 16), width: W - pad - 4, height: Y(b * 16) - Y((b + 1) * 16), fill: bandCol[b % 2], id: id + '-band-' + b }, svg);
    if (opts.labels) txt(svg, W - 6, Y(b * 16 + 8) + 4, `${b + 1}. Runde`, { 'text-anchor': 'end', 'font-size': 10 });
  }
  for (let v = 16; v <= 80; v += 16) { sv('line', { x1: pad, y1: Y(v), x2: W - 4, y2: Y(v), stroke: '#334155', 'stroke-dasharray': '4 4' }, svg); txt(svg, pad - 4, Y(v) + 4, String(v), { 'text-anchor': 'end', 'font-size': 10 }); }
  sv('line', { x1: pad, y1: bottom, x2: W - 4, y2: bottom, stroke: '#475569' }, svg);
  sv('line', { x1: pad, y1: top, x2: pad, y2: bottom, stroke: '#475569' }, svg);
  for (let v = 0; v < 16; v += 3) txt(svg, X(v), bottom + 14, String(v), { 'text-anchor': 'middle', 'font-size': 10 });
  sv('line', { x1: X(0), y1: Y(3), x2: X(15.4), y2: Y(5 * 15.4 + 3), stroke: '#38bdf8', 'stroke-width': 2.5 }, svg);
  const oldG = sv('g', {}, svg), curG = sv('g', {}, svg);
  return {
    svg, X, Y, pad, bottom, oldG, curG,
    resetBands() { for (let b = 0; b < 5; b++) $(id + '-band-' + b).setAttribute('fill', bandCol[b % 2]); },
    band(b, color) { const e = $(id + '-band-' + Math.min(4, b)); if (e) e.setAttribute('fill', color); },
    newStep() { while (curG.firstChild) oldG.appendChild(curG.firstChild); fadeOld(oldG); this.resetBands(); }
  };
}
function numberLine(min, max, a, b, opts = {}) {
  const w = opts.w || 560, h = 90, pad = 30;
  const X = v => pad + (v - min) / (max - min) * (w - 2 * pad);
  const svg = svgBox(w, h); svg.style.width = Math.min(w, $('stage').clientWidth - 30) + 'px';
  sv('line', { x1: pad - 10, y1: 50, x2: w - pad + 10, y2: 50, stroke: '#475569', 'stroke-width': 2 }, svg);
  for (let v = min; v <= max + 1e-9; v += (opts.tick || 1)) {
    sv('line', { x1: X(v), y1: 44, x2: X(v), y2: 56, stroke: '#475569' }, svg);
    txt(svg, X(v), 76, String(+v.toFixed(2)), { 'text-anchor': 'middle' });
  }
  if (opts.valid) sv('rect', { x: X(opts.valid[0]) - 3, y: 59, width: X(opts.valid[1]) - X(opts.valid[0]) + 6, height: 5, rx: 2, fill: '#10b981' }, svg);
  const seg = sv('rect', { x: X(a), y: 42, width: Math.max(0, X(b) - X(a)), height: 16, rx: 4, fill: opts.color || '#10b981', opacity: .55 }, svg);
  seg.style.transition = 'all .9s ease';
  const l = txt(svg, X(a), 30, '[', { 'text-anchor': 'middle', fill: '#10b981', 'font-size': 18, 'font-weight': 700 });
  const r = txt(svg, X(b), 30, ')', { 'text-anchor': 'middle', fill: '#ef4444', 'font-size': 18, 'font-weight': 700 });
  l.style.transition = r.style.transition = 'all .9s ease';
  return { svg, X, move(na, nb) { seg.setAttribute('x', X(na)); seg.setAttribute('width', Math.max(0, X(nb) - X(na))); l.setAttribute('x', X(na)); r.setAttribute('x', X(nb)); }, color(c) { seg.setAttribute('fill', c); } };
}
function stepper(n, step, delay) {

const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
function primes(n) { const p = []; for (let f = 2; f * f <= n; f++) { if (n % f === 0) { p.push(f); while (n % f === 0) n /= f; } } if (n > 1) p.push(n); return p; }

// ===================== Schritte =====================
// ===================== Helfer fuer die "Whoaaa"-Anwendungen =====================
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const gaussR = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());

const mT = X => X[0].map((_, j) => X.map(r => r[j]));
const mVec = (X, v) => X.map(r => r.reduce((s, x, k) => s + x * v[k], 0));

        else chip('ok', `③ m = ${m} ist nicht durch 4 teilbar – keine Bedingung`, 'Bedingung 3 gilt nur, wenn m durch 4 teilbar ist.');
        if (c1 && c2 && c3) chip('ok', '⇒ C: volle Periode, alle Stellen werden besucht', 'Satz von Hull und Dobell');
        else { const fix = chip('info', `⇒ keine volle Periode. So geht es: k = ${c2 && c3 ? k : kOk}, d = ${c1 ? d : dOk} (klick)`, 'Klick setzt die vorgeschlagenen Werte.'); fix.style.cursor = 'pointer'; fix.onclick = () => { $('wk').value = c2 && c3 ? k : kOk; $('wd').value = c1 ? d : dOk; bShift = 0; ctrl = build(); ctrl.solve(); }; }

        // 95%-Schnitt: erster Zeitpunkt, an dem 5 % der Zukuenfte pleite sind
        x.strokeStyle = '#fbbf24'; x.setLineDash([6, 4]); x.lineWidth = 1.5; x.beginPath(); x.moveTo(l, sy(.05)); x.lineTo(l + w, sy(.05)); x.stroke(); x.setLineDash([]);
        x.fillStyle = '#fbbf24'; x.font = '11px Inter'; x.fillText('5 % pleite', l + w - 60, sy(.05) - 4);
        let tc = -1; if (n >= 50) for (let k = 0; k <= TD; k++) if (cum[k] / n >= .05) { tc = k; break; }
        if (tc >= 0) { x.strokeStyle = '#fbbf24'; x.lineWidth = 2; x.beginPath(); x.moveTo(sx(tc), t); x.lineTo(sx(tc), t + h); x.stroke(); x.beginPath(); x.arc(sx(tc), sy(.05), 5, 0, 7); x.fillStyle = '#fbbf24'; x.fill();
          x.font = '700 14px Inter'; x.fillText(`95%-Schnitt: ${(tc / 52).toFixed(1)} Jahre`, Math.min(sx(tc) + 8, l + w - 190), t + 16);
          x.font = '12px Inter'; x.fillStyle = '#e2e8f0'; x.fillText(`Mit 95 % Sicherheit ist meine Firma die ersten ${(tc / 52).toFixed(1)} Jahre nicht pleite.`, l, 32); }
        else { x.font = '12px Inter'; x.fillStyle = '#94a3b8'; x.fillText(n < 50 ? 'Mehr Zukünfte nötig (⏩) für den 95%-Schnitt …' : 'In 5 Jahren werden keine 5 % pleite.', l, 32); }
      }
      function drawFan() {
        if (all.length < 50) return;
        const ts = []; for (let t = 0; t <= TD; t += 4) ts.push(t); if (ts[ts.length - 1] !== TD) ts.push(TD);
        const Q = ts.map(t => { const v = Float32Array.from(all, f => f[t]).sort(); const q = p => v[Math.min(v.length - 1, Math.floor(p * (v.length - 1)))]; return [q(.05), q(.25), q(.5), q(.75), q(.95)]; });
        const band = (i, j, c) => { P.fillStyle = c; P.beginPath(); ts.forEach((t, k) => k ? P.lineTo(px(t), py(Q[k][j])) : P.moveTo(px(t), py(Q[k][j]))); for (let k = ts.length - 1; k >= 0; k--) P.lineTo(px(ts[k]), py(Q[k][i])); P.fill(); };
        band(0, 4, 'rgba(56,189,248,.18)'); band(1, 3, 'rgba(56,189,248,.3)');
        P.strokeStyle = '#f8fafc'; P.lineWidth = 2.5; P.beginPath(); ts.forEach((t, k) => k ? P.lineTo(px(t), py(Q[k][2])) : P.moveTo(px(t), py(Q[k][2]))); P.stroke();
        P.strokeStyle = '#fbbf24'; P.lineWidth = 2; P.setLineDash([6, 4]); P.beginPath(); ts.forEach((t, k) => k ? P.lineTo(px(t), py(Q[k][0])) : P.moveTo(px(t), py(Q[k][0]))); P.stroke(); P.setLineDash([]);
        const last = Q[Q.length - 1], y1 = Q[ts.indexOf(52)];
        P.font = '700 12px Inter'; P.fillStyle = '#f8fafc'; P.fillText(`Median nach 5 J: ${last[2].toFixed(1)} Mio.`, px(TD) - 170, py(last[2]) - 6);
        P.fillStyle = '#fbbf24'; P.fillText(`5%-Quantil nach 1 J: ${y1[0].toFixed(1)} Mio.`, px(52) + 6, py(y1[0]) + 16);
        P.font = '11px Inter'; P.fillStyle = '#94a3b8'; P.fillText('Fläche: 25–75 % und 5–95 % aller Zukünfte · weiß = Median · gelb = 5%-Quantil', pl + 4, pt + 12);
      }
      drawPD();
      return {
        i: 0,
        next() {
          if (this.i >= 5) return false; this.i++; clearTimers();
          bg(); sims.forEach(p => drawPath(p, .35, 1)); const p = onePath(); sims.push(p);
          let t = 0; setHl({ o: [6], r: [] }); blink('o', 2);
          every(25, () => {
            if (t >= p.path.length - 1) return;
            t = Math.min(p.path.length - 1, t + 3); drawPath(p, 1, 2.3, t);
            setHl({ o: p.jumps.some(j => j > t - 3 && j <= t) ? [10, 11] : [4, 5, 6, 7, 8] });
            if (t >= p.path.length - 1) { add(p); drawPD(); setHl({ o: p.def >= 0 ? [12] : [2] }); blink('o', p.def >= 0 ? 12 : 2); }
          });
          return true;
        },
        auto() {
          clearTimers(); this.i = 5; bg(); setHl({ o: [2, 12] });
          let tick = 0; every(40, () => { if (n >= 3000) return; for (let k = 0; k < 40 && n < 3000; k++) { const p = onePath(); add(p); if (k < 5) drawPath(p, .12, 1); } drawPD(); if (n >= 3000) drawFan(); });
        }
      };
    } }
];

// ===================== Navigation =====================
let cur = 0, ctrl = null;
function buildTabs() {
  chapters.forEach((c, i) => {
    const b = el('button', '', (i + 1) + '. ' + c);
    b.onclick = () => show(steps.findIndex(s => s.ch === i));
    $('tabs').appendChild(b);
  });
}
function show(i) {
  clearTimers();
  cur = Math.max(0, Math.min(steps.length - 1, i));
  const s = steps[cur];
  document.querySelectorAll('#tabs button').forEach((b, k) => b.classList.toggle('active', k === s.ch));
  $('title').textContent = s.title;
  $('counter').textContent = `Schritt ${cur + 1} / ${steps.length}`;
  $('text').innerHTML = s.text;
  $('text').parentElement.style.flex = s.textSize || 1;   // Erklaerung pro Folie kleiner machbar
  renderCode(s);
  $('left').style.display = s.noCode ? 'none' : '';   // Folien ohne Code: Animation volle Breite
  $('right').style.width = s.noCode ? '100%' : '';
  const st = $('stage'); st.innerHTML = '';
  if (s.ch === 6 && !window.__aiyCaches['normal|-']) aiyStart('normal|-');   // Aiyagari-Modell im Hintergrund vorbereiten
  ctrl = s.render(st) || null;
  $('autoBtn').disabled = !(ctrl && ctrl.auto);
}
function go(d) {
  if (d > 0 && ctrl && ctrl.next && ctrl.next()) return;
  show(cur + d);
}
function replay() { show(cur); }
function toChapterEnd() { const c = steps[cur].ch; let i = cur; while (i + 1 < steps.length && steps[i + 1].ch === c) i++; show(i === cur && cur + 1 < steps.length ? cur : i); }
function jumpTo(id) { const i = steps.findIndex(s => s.id === id); if (i >= 0) show(i); }
function runAuto() { if (ctrl && ctrl.auto) { $('autoBtn').disabled = true; ctrl.auto(); } }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;   // Eingabefelder im Parameter-Labor
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  if (e.key === 'r' || e.key === 'R') replay();
});
let rs; window.addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => show(cur), 200); });
buildTabs();
show(0);
</script>
