        function createGrid(fillChar) {
            const g = [];
            for (let y = 0; y < 10; y++) {
                const row = [];
                for (let x = 0; x < 10; x++) row.push(fillChar);
                g.push(row);
            }
            return g;
        }

        const gridNull = createGrid("null");
        const gridEarth = createGrid("🟫");
        
        // Grid with only first row filled (to illustrate outer/inner loop mechanics)
        const gridFirstRowEarth = createGrid("null");
        for (let x = 0; x < 10; x++) gridFirstRowEarth[0][x] = "🟫";

        const gridWithBaggers = createGrid("🟫");
        const baggerCoords = [[1, 2], [4, 7], [8, 3]];
        baggerCoords.forEach(([y, x]) => { gridWithBaggers[y][x] = "🏗️"; });

        const gridWithWater = JSON.parse(JSON.stringify(gridWithBaggers));
        const waterCoords = [
            [0,1],[0,6],[1,8],[2,3],[2,9],[3,0],[3,5],[4,2],[5,6],[5,9],
            [6,1],[6,4],[7,7],[8,0],[8,8],[9,2],[9,5]
        ];
        waterCoords.forEach(([y, x]) => { gridWithWater[y][x] = "💧"; });

        const gridFinal = JSON.parse(JSON.stringify(gridWithWater));
        const stoneCoords = [
            [0,4],[1,5],[2,0],[2,6],[3,8],[4,4],[5,1],[5,3],[6,7],[7,2],
            [7,9],[8,5],[9,1],[9,8]
        ];
        stoneCoords.forEach(([y, x]) => { gridFinal[y][x] = "🗿"; });

        function tp(t) { return `<span class="text-emerald-300 font-semibold">${t}</span>`; }
        function fn(t) { return `<span class="text-sky-300">${t}</span>`; }
        function st(t) { return `<span class="text-amber-300">${t}</span>`; }
        function cm(t) { return `<span class="text-slate-500 italic">${t}</span>`; }
        function nm(t) { return `<span class="text-purple-300">${t}</span>`; }

        // Reusable file templates for completed files
        const baggerEmpty = [
            `${kw('public class')}${tp('Bagger')}`,
            `{`,
            `}`

            `{`,
            `    ${kw('public')}${tp('Baugrube')} Baugrube { ${kw('get')};${kw('private set')}; }`,
            `    ${kw('public')} (${kw('int')} x,${kw('int')} y) Position { ${kw('get')};${kw('private set')}; }`,
            ``,
            `    ${kw('public')} ${fn('Bagger')}(${tp('Baugrube')} baugrube)`,
            `    {`,
            `        Baugrube = baugrube;`,
            `        ${fn('Platzieren')}();`,
            `    }`,
            ``,
            `    ${kw('public void')}${fn('Platzieren')}()`,
            `    {`,
            `        ${tp('Random')} random = ${kw('new')}${tp('Random')}();`,
            ``,
            `        ${kw('do')}`,
            `        {`,
            `            Position = (random.${fn('Next')}(${nm('0')}, Baugrube.Size), random.${fn('Next')}(${nm('0')}, Baugrube.Size));`,
            `        } ${kw('while')} (!Baugrube.${fn('Anfrage')}(${kw('this')}, Position));`,
            `    }`,
            `}`
        ];

        let currentStep = 0;
        let currentTab = "Baugrube.cs";

        function switchTab(tabName) {
            currentTab = tabName;
            renderCode();
        }

        function renderTabs() {
            const tabs = ["Baugrube.cs", "Bagger.cs", "Program.cs"];
            tabs.forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const isCurrent = (tab === currentTab);
                const isStepPrimary = (tab === steps[currentStep].activeTab);
                const dot = isStepPrimary ? `<span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>` : ``;
                if (isCurrent) {
                    btn.className = "px-4 py-2 text-xs font-code font-bold rounded-t-lg border-t border-x border-slate-700 bg-slate-900 text-sky-400 flex items-center gap-2";
                } else {
                    btn.className = "px-4 py-2 text-xs font-code font-semibold rounded-t-lg border-t border-x border-transparent bg-slate-950 text-slate-400 hover:text-slate-200 flex items-center gap-2";
                }
                btn.innerHTML = `${dot}<span>${tab}</span>`;
            });
        }

        function renderCode() {
            renderTabs();
            const step = steps[currentStep];
            const lines = step.files[currentTab] || [];
            const isPrimaryTab = (currentTab === step.activeTab);

            const html = lines.map((line, idx) => {
                const isActive = isPrimaryTab && step.activeLines.includes(idx);
                const rowClass = isActive ? "line-active text-sky-50" : "line-normal text-slate-300";
                const idAttr = (isActive && idx === step.activeLines[0]) ? 'id="first-active-line"' : '';
                return `<div ${idAttr} class="flex px-2 py-0.5 rounded ${rowClass}">
                    <span class="w-7 shrink-0 text-right text-slate-600 mr-3 text-xs select-none border-r border-slate-800 pr-2">${idx + 1}</span>
                    <span class="whitespace-pre">${line}</span>
                </div>`;
            }).join("");

            const container = document.getElementById("code-container");
            container.innerHTML = html;

            const activeEl = document.getElementById("first-active-line");
            if (activeEl) {
                activeEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        }

        function renderClassCardBody(props, methods) {
            if (props.length === 0 && methods.length === 0) {
                return `<div class="p-3 text-[11px] text-slate-400 italic text-center bg-white">Noch leer</div>`;
            }
            let html = "";
            if (props.length > 0) {
                html += `<div class="vs-section"><span>◢</span><span>Properties</span></div>`;
                props.forEach(p => {
                    const cls = p.isNew ? "vs-item vs-item-new" : "vs-item";
                    html += `<div class="${cls}"><span class="text-slate-500">🔧</span><span>${p.name}</span></div>`;
                });
            }
            if (methods.length > 0) {
                html += `<div class="vs-section"><span>◢</span><span>Methods</span></div>`;
                methods.forEach(m => {
                    const cls = m.isNew ? "vs-item vs-item-new" : "vs-item";
                    html += `<div class="${cls}"><span class="text-purple-600 font-bold">&#x2B22;</span><span>${m.name}</span></div>`;
                });
            }
            return html;
        }

        function renderDiagram() {
            const d = steps[currentStep].diagram;
            document.getElementById("cd-bagger-body").innerHTML = renderClassCardBody(d.baggerProps, d.baggerMethods);
            document.getElementById("cd-baugrube-body").innerHTML = renderClassCardBody(d.baugrubeProps, d.baugrubeMethods);

            const baggerCard = document.getElementById("cd-bagger");
            const baugrubeCard = document.getElementById("cd-baugrube");

            baggerCard.className = "vs-card w-[170px] z-10 " + ((d.highlightCard === "bagger" || d.highlightCard === "both") ? "vs-card-highlight" : "");
            baugrubeCard.className = "vs-card w-[170px] z-10 " + ((d.highlightCard === "baugrube" || d.highlightCard === "both") ? "vs-card-highlight" : "");

            document.getElementById("arrow-bagger-arr").style.opacity = d.arrowBaggerArr ? "1" : "0";
            document.getElementById("arrow-baugrube-ref").style.opacity = d.arrowBaugrubeRef ? "1" : "0";
        }

        function renderGrid() {
            const gs = steps[currentStep].gridState;
            const panel = document.getElementById("grid-panel");

            if (!gs) {
                panel.innerHTML = `
                    <div class="text-center p-4 max-w-sm">
                        <div class="text-2xl mb-2 opacity-60">⏳</div>
                        <div class="text-xs font-semibold text-slate-400 mb-1">2D-Array <code class="text-sky-400">Grube[,]</code> noch nicht instanziiert</div>
                        <div class="text-[11px] text-slate-500">Sobald wir im Konstruktor von <code class="text-slate-400">Baugrube</code> die Zeile <code class="text-emerald-400">Grube = new string[size, size];</code> erreichen (ab Schritt 20), siehst du hier live jeden Änderungsschritt des 2D-Arrays!</div>
                    </div>
                `;
                return;
            }

            const highlightSet = new Set((gs.highlightCoords || []).map(([y, x]) => `${y},${x}`));

            let rowsHtml = "";
            for (let y = 0; y < 10; y++) {
                let cellsHtml = `<span class="w-4 text-[10px] text-slate-500 font-code text-right mr-1">${y}</span>`;
                for (let x = 0; x < 10; x++) {
                    const val = gs.grid[y][x];
                    const isHl = highlightSet.has(`${y},${x}`);
                    const hlClass = isHl ? "grid-cell-highlight" : "";
                    if (gs.isNullGrid || val === "null") {
                        cellsHtml += `<div class="grid-cell text-[9px] text-slate-500 font-code ${hlClass}">·</div>`;
                    } else {
                        cellsHtml += `<div class="grid-cell ${hlClass}">${val}</div>`;
                    }
                }
                rowsHtml += `<div class="flex items-center gap-0.5">${cellsHtml}</div>`;
            }

            let colHeader = `<span class="w-4 mr-1"></span>`;
            for (let x = 0; x < 10; x++) {
                colHeader += `<span class="w-[24px] text-center text-[10px] text-slate-500 font-code">${x}</span>`;
            }

            panel.innerHTML = `
                <div class="w-full flex flex-col items-center">
                    <div class="text-[11px] font-code text-emerald-400 mb-1.5 font-semibold text-center">${gs.label}</div>
                    <div class="bg-slate-900/90 p-2 rounded-lg border border-slate-800 flex flex-col gap-0.5">
                        <div class="flex items-center gap-0.5 mb-0.5">${colHeader}</div>
                        ${rowsHtml}
                    </div>
                </div>
            `;
        }

        function render() {
            const step = steps[currentStep];
            currentTab = step.activeTab;

            document.getElementById("btn-prev").disabled = (currentStep === 0);
            document.getElementById("btn-next").disabled = (currentStep === steps.length - 1);
            document.getElementById("step-current").textContent = currentStep + 1;
            document.getElementById("step-total").textContent = steps.length;
            document.getElementById("phase-badge").textContent = step.phase;
            document.getElementById("step-title").textContent = step.title;
            document.getElementById("explanation-text").innerHTML = step.desc;

            renderCode();
            renderDiagram();
            renderGrid();
        }

        document.getElementById("btn-next").addEventListener("click", () => {
            if (currentStep < steps.length - 1) { currentStep++; render(); }
        });
        document.getElementById("btn-prev").addEventListener("click", () => {
            if (currentStep > 0) { currentStep--; render(); }
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") document.getElementById("btn-next").click();
            if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
        });

        render();
    </script>
