<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Memory Visualizer: Object Graphs & Value Types in Heap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* Slate 950 */
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }
        .font-code { font-family: 'Fira Code', monospace; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @keyframes pushFrame {
            0% { opacity: 0; transform: translateY(-20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .frame-push { animation: pushFrame 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .item-enter { animation: fadeIn 0.4s ease-out forwards; }

        .line-active {
            background-color: rgba(56, 189, 248, 0.15);
            border-left: 4px solid #38bdf8;
        }
        .line-normal { border-left: 4px solid transparent; }

        .ref-badge {
            background-color: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #cbd5e1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        /* Value badge inside Heap */
        .val-badge {
            background-color: rgba(217, 70, 239, 0.15);
            border: 1px solid rgba(217, 70, 239, 0.4);
            color: #e879f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .ref-badge.H1 { border-color: rgba(236, 72, 153, 0.5); color: #f472b6; background-color: rgba(236, 72, 153, 0.1); }
        .ref-badge.P1 { border-color: rgba(16, 185, 129, 0.5); color: #34d399; background-color: rgba(16, 185, 129, 0.1); }
        .ref-badge.A1 { border-color: rgba(245, 158, 11, 0.5); color: #fbbf24; background-color: rgba(245, 158, 11, 0.1); }
        .ref-badge.null { border-color: rgba(71, 85, 105, 0.5); color: #94a3b8; border-style: dashed; }

        /* SVG Arrow Layer */
        #svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to UI */
            z-index: 100;
        }
        
        .arrow-path {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            opacity: 0.8;
            transition: d 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        /* Pulse Animation for new values in Grid */
        @keyframes pulseCell {
            0% { background-color: rgba(56, 189, 248, 0.5); }
            100% { background-color: transparent; }
        }
        .cell-updated { animation: pulseCell 1.5s ease-out; }
    </style>
</head>

<body class="h-screen flex flex-col relative">
    
    <svg id="svg-layer">
        <defs>
            <!-- Marker for Stack to Heap -->
            <marker id="arrow-stack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
            </marker>
            <!-- Marker for Heap to Heap (H1) -->
            <marker id="arrow-H1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#f472b6" />
            </marker>
            <!-- Marker for Heap to Heap (P1) -->
            <marker id="arrow-P1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
            </marker>
            <!-- Marker for Heap to Heap (A1) -->
            <marker id="arrow-A1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24" />
            </marker>
        </defs>
        <g id="arrows-container"></g>
    </svg>

    <header class="bg-slate-900 border-b border-slate-800 p-4 shrink-0 shadow-md relative z-20">
        <div>
            <h1 class="text-2xl font-bold text-sky-400 tracking-tight">Object Graph & Wertetypen auf dem Heap</h1>
            <p class="text-sm text-slate-400 mt-1">Bidirektionale Referenzen & eingebettete Wertetypen (double)</p>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-4 gap-6 bg-slate-950 relative z-10" id="main-area">
        
        <!-- Code Section -->
        <section class="flex-1 lg:flex-[1.1] bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl relative">
            <div class="bg-slate-950 py-2 px-4 border-b border-slate-800 flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                <span class="ml-2 text-xs font-semibold text-slate-500 uppercase tracking-widest">Program.cs</span>
            </div>
            <div id="code-container" class="flex-1 overflow-y-auto p-4 font-code text-[14px] sm:text-[15px] leading-7">
                <!-- Code wird hier generiert -->
            </div>
        </section>

        <!-- Memory Section (Stack & Heap) -->
        <section class="flex-1 lg:flex-[1.9] flex flex-col lg:flex-row gap-6 overflow-hidden">
            
            <!-- Call Stack -->
            <div class="flex-1 bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl">
                <div class="bg-slate-950 py-2 px-4 border-b border-slate-800">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        Call Stack
                    </span>
                </div>
                <div id="stack-container" class="flex-1 overflow-y-auto p-4 flex flex-col-reverse gap-4 bg-slate-900/50">
                    <!-- Stack Frames -->
                </div>
            </div>

            <!-- Managed Heap -->
            <div class="flex-[1.5] bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl">
                <div class="bg-slate-950 py-2 px-4 border-b border-slate-800">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        Managed Heap
                    </span>
                </div>
                <div id="heap-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-6 bg-slate-900/50">
                    <!-- Heap Objects -->
                </div>
            </div>

        </section>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 shrink-0 relative z-20 p-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 max-w-7xl mx-auto items-center">
            <div class="lg:col-span-2 bg-slate-950 border border-slate-800 rounded-lg p-4 min-h-[90px] flex flex-col justify-center">
                <h3 class="text-xs uppercase font-bold text-sky-400 mb-1 tracking-wider">Aktion</h3>
                <p id="explanation-text" class="text-sm text-slate-300 leading-relaxed"></p>
            </div>

            <div class="flex flex-col items-center justify-center gap-3">
                <div class="flex items-center gap-3">
                    <button id="btn-prev" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg shadow disabled:opacity-30 transition-all text-sm font-medium border border-slate-700">&larr; Zurück</button>
                    <div class="bg-slate-950 px-4 py-2.5 rounded-lg border border-slate-800 font-code text-sm min-w-[90px] text-center">
                        <span id="step-current" class="text-sky-400 font-bold"></span><span class="text-slate-500">/</span><span id="step-total" class="text-slate-400"></span>
                    </div>
                    <button id="btn-next" class="px-5 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg shadow-lg disabled:opacity-30 transition-all text-sm font-bold border border-sky-500">Weiter &rarr;</button>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // C# Quellcode
        const rawCode = [
            /* 0*/ "<span class='text-pink-400'>class</span> <span class='text-emerald-300'>Hamster</span> {",
            /* 1*/ "    <span class='text-pink-400'>public double</span> GroesseInMm;",
            /* 2*/ "    <span class='text-pink-400'>public</span> <span class='text-emerald-300'>Plane</span> Spielfeld;",
            /* 3*/ "}",
            /* 4*/ "<span class='text-pink-400'>class</span> <span class='text-emerald-300'>Plane</span> {",
            /* 5*/ "    <span class='text-pink-400'>public</span> <span class='text-emerald-300'>Hamster</span> Spieler;",
            /* 6*/ "    <span class='text-pink-400'>public string</span>[,] Gitter;",
            /* 7*/ "    <span class='text-pink-400'>public</span> <span class='text-emerald-300'>Plane</span>(<span class='text-emerald-300'>Hamster</span> hamster) {",
            /* 8*/ "        <span class='text-pink-400'>this</span>.Spieler = hamster;",
            /* 9*/ "        hamster.Spielfeld = <span class='text-pink-400'>this</span>;",
            /*10*/ "        <span class='text-pink-400'>this</span>.Gitter = <span class='text-pink-400'>new</span> <span class='text-sky-300'>string</span>[<span class='text-fuchsia-400'>2</span>, <span class='text-fuchsia-400'>2</span>];",
            /*11*/ "        <span class='text-pink-400'>this</span>.Gitter[<span class='text-fuchsia-400'>0</span>, <span class='text-fuchsia-400'>0</span>] = <span class='text-amber-300'>\"🐹\"</span>;",
            /*12*/ "    }",
            /*13*/ "}",
            /*14*/ "<span class='text-pink-400'>static void</span> <span class='text-sky-300'>Main</span>() {",
            /*15*/ "    <span class='text-emerald-300'>Hamster</span> h = <span class='text-pink-400'>new</span> <span class='text-emerald-300'>Hamster</span>();",
            /*16*/ "    h.GroesseInMm = <span class='text-fuchsia-400'>120.5</span>;",
            /*17*/ "    <span class='text-emerald-300'>Plane</span> p = <span class='text-pink-400'>new</span> <span class='text-emerald-300'>Plane</span>(h);",
            /*18*/ "}"
        ];

        // Status der Animation (State Machine)
        const steps = [
            {
                line: -1, stack: [], heap: {}, arrows: [],
                desc: "Programm ist bereit. Drücke auf 'Weiter', um den Start von <code>Main()</code> zu simulieren."
            },
            {
                line: 14, 
                stack: [ { id: "frame-0", name: "Main()", vars: {} } ], 
                heap: {}, arrows: [],
                desc: "<strong>Schritt 1:</strong> <code>Main()</code> startet. Ein neuer Stack-Frame wird angelegt."
            },
            {
                line: 15, 
                stack: [ { id: "frame-0", name: "Main()", vars: { "h": "0xH1" } } ], 
                heap: { 
                    "0xH1": { id: "heap-0xH1", type: "Hamster", props: { "GroesseInMm": "0.0", "Spielfeld": "null" } } 
                }, 
                arrows: [ { from: "stack-frame-0-h", to: "heap-0xH1", type: "stack" } ],
                desc: "<strong>Schritt 2:</strong> <code>new Hamster()</code> erzeugt ein Objekt auf dem Heap <span class='ref-badge H1'>0xH1</span>. Die Stack-Variable <code>h</code> verweist darauf. Der Wertetyp <code>GroesseInMm</code> wird als Teil des Objekts auf dem Heap mit <code>0.0</code> (Standardwert) initialisiert."
            },
            {
                line: 16, 
                stack: [ { id: "frame-0", name: "Main()", vars: { "h": "0xH1" } } ], 
                heap: { 
                    "0xH1": { id: "heap-0xH1", type: "Hamster", props: { "GroesseInMm": "120.5", "Spielfeld": "null" } } 
                }, 
                arrows: [ { from: "stack-frame-0-h", to: "heap-0xH1", type: "stack" } ],
                desc: "<strong>Schritt 3:</strong> <code>h.GroesseInMm = 120.5;</code> überschreibt den Wert direkt im Heap-Objekt. <strong>Wichtig:</strong> Wertetypen, die Teil einer Klasse sind, liegen auf dem Heap!"
            },
            {
                line: 7, 
                stack: [ 
                    { id: "frame-0", name: "Main()", vars: { "h": "0xH1" } },
                    { id: "frame-1", name: "Plane(hamster)", vars: { "this": "0xP1", "hamster": "0xH1" } }
                ], 
                heap: { 
                    "0xH1": { id: "heap-0xH1", type: "Hamster", props: { "GroesseInMm": "120.5", "Spielfeld": "null" } },
                    "0xP1": { id: "heap-0xP1", type: "Plane", props: { "Spieler": "null", "Gitter": "null" } }
                }, 
                arrows: [ 
                    { from: "stack-frame-0-h", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-hamster", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-this", to: "heap-0xP1", type: "stack" }
                ],
                desc: "<strong>Schritt 4:</strong> Aufruf von <code>new Plane(h)</code>. Konstruktor-Frame auf dem Stack. <code>hamster</code> übernimmt die Referenz <span class='ref-badge H1'>0xH1</span>. Ein neues Plane-Objekt <span class='ref-badge P1'>0xP1</span> entsteht, worauf <code>this</code> zeigt."
            },
            {
                line: 8, 
                stack: [ 
                    { id: "frame-0", name: "Main()", vars: { "h": "0xH1" } },
                    { id: "frame-1", name: "Plane(hamster)", vars: { "this": "0xP1", "hamster": "0xH1" } }
                ], 
                heap: { 
                    "0xH1": { id: "heap-0xH1", type: "Hamster", props: { "GroesseInMm": "120.5", "Spielfeld": "null" } },
                    "0xP1": { id: "heap-0xP1", type: "Plane", props: { "Spieler": "0xH1", "Gitter": "null" } }
                }, 
                arrows: [ 
                    { from: "stack-frame-0-h", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-hamster", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-this", to: "heap-0xP1", type: "stack" },
                    { from: "prop-0xP1-Spieler", to: "heap-0xH1", type: "H1" }
                ],
                desc: "<strong>Schritt 5:</strong> <code>this.Spieler = hamster;</code> speichert die Referenz im Heap-Objekt. Ein Pfeil vom Plane-Objekt <span class='ref-badge P1'>0xP1</span> zeigt nun auf das Hamster-Objekt <span class='ref-badge H1'>0xH1</span>."
            },
            {
                line: 9, 
                stack: [ 
                    { id: "frame-0", name: "Main()", vars: { "h": "0xH1" } },
                    { id: "frame-1", name: "Plane(hamster)", vars: { "this": "0xP1", "hamster": "0xH1" } }
                ], 
                heap: { 
                    "0xH1": { id: "heap-0xH1", type: "Hamster", props: { "GroesseInMm": "120.5", "Spielfeld": "0xP1" } },
                    "0xP1": { id: "heap-0xP1", type: "Plane", props: { "Spieler": "0xH1", "Gitter": "null" } }
                }, 
                arrows: [ 
                    { from: "stack-frame-0-h", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-hamster", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-this", to: "heap-0xP1", type: "stack" },
                    { from: "prop-0xP1-Spieler", to: "heap-0xH1", type: "H1" },
                    { from: "prop-0xH1-Spielfeld", to: "heap-0xP1", type: "P1" }
                ],
                desc: "<strong>Schritt 6:</strong> <code>hamster.Spielfeld = this;</code> schließt den Kreis. Das Hamster-Objekt zeigt nun auf das Plane-Objekt. Wir haben eine <strong>bidirektionale Referenz</strong> (Gegenseitige Abhängigkeit) aufgebaut."
            },
            {
                line: 10, 
                stack: [ 
                    { id: "frame-0", name: "Main()", vars: { "h": "0xH1" } },
                    { id: "frame-1", name: "Plane(hamster)", vars: { "this": "0xP1", "hamster": "0xH1" } }
                ], 
                heap: { 
                    "0xH1": { id: "heap-0xH1", type: "Hamster", props: { "GroesseInMm": "120.5", "Spielfeld": "0xP1" } },
                    "0xP1": { id: "heap-0xP1", type: "Plane", props: { "Spieler": "0xH1", "Gitter": "0xA1" } },
                    "0xA1": { id: "heap-0xA1", type: "string[,]", isArray: true, grid: [["", ""], ["", ""]] }
                }, 
                arrows: [ 
                    { from: "stack-frame-0-h", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-hamster", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-this", to: "heap-0xP1", type: "stack" },
                    { from: "prop-0xP1-Spieler", to: "heap-0xH1", type: "H1" },
                    { from: "prop-0xH1-Spielfeld", to: "heap-0xP1", type: "P1" },
                    { from: "prop-0xP1-Gitter", to: "heap-0xA1", type: "A1" }
                ],
                desc: "<strong>Schritt 7:</strong> <code>new string[2, 2]</code> erstellt ein neues 2D-Array-Objekt auf dem Heap <span class='ref-badge A1'>0xA1</span>. Die Eigenschaft <code>Gitter</code> im Plane-Objekt verweist darauf."
            },
            {
                line: 11, 
                stack: [ 
                    { id: "frame-0", name: "Main()", vars: { "h": "0xH1" } },
                    { id: "frame-1", name: "Plane(hamster)", vars: { "this": "0xP1", "hamster": "0xH1" } }
                ], 
                heap: { 
                    "0xH1": { id: "heap-0xH1", type: "Hamster", props: { "GroesseInMm": "120.5", "Spielfeld": "0xP1" } },
                    "0xP1": { id: "heap-0xP1", type: "Plane", props: { "Spieler": "0xH1", "Gitter": "0xA1" } },
                    "0xA1": { id: "heap-0xA1", type: "string[,]", isArray: true, grid: [["🐹", ""], ["", ""]], updated: "0,0" }
                }, 
                arrows: [ 
                    { from: "stack-frame-0-h", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-hamster", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-1-this", to: "heap-0xP1", type: "stack" },
                    { from: "prop-0xP1-Spieler", to: "heap-0xH1", type: "H1" },
                    { from: "prop-0xH1-Spielfeld", to: "heap-0xP1", type: "P1" },
                    { from: "prop-0xP1-Gitter", to: "heap-0xA1", type: "A1" }
                ],
                desc: "<strong>Schritt 8:</strong> <code>this.Gitter[0, 0] = \"🐹\";</code>. Das Hamster-Symbol wird im Array auf dem Heap exakt an der Position [0,0] abgelegt."
            },
            {
                line: 17, 
                stack: [ 
                    { id: "frame-0", name: "Main()", vars: { "h": "0xH1", "p": "0xP1" } }
                ], 
                heap: { 
                    "0xH1": { id: "heap-0xH1", type: "Hamster", props: { "GroesseInMm": "120.5", "Spielfeld": "0xP1" } },
                    "0xP1": { id: "heap-0xP1", type: "Plane", props: { "Spieler": "0xH1", "Gitter": "0xA1" } },
                    "0xA1": { id: "heap-0xA1", type: "string[,]", isArray: true, grid: [["🐹", ""], ["", ""]] }
                }, 
                arrows: [ 
                    { from: "stack-frame-0-h", to: "heap-0xH1", type: "stack" },
                    { from: "stack-frame-0-p", to: "heap-0xP1", type: "stack" },
                    { from: "prop-0xP1-Spieler", to: "heap-0xH1", type: "H1" },
                    { from: "prop-0xH1-Spielfeld", to: "heap-0xP1", type: "P1" },
                    { from: "prop-0xP1-Gitter", to: "heap-0xA1", type: "A1" }
                ],
                desc: "<strong>Schritt 9:</strong> Konstruktor endet (Pop). Die <code>Plane</code>-Methode verschwindet vom Stack. Zurück in <code>Main()</code> wird die Adresse in Variable <code>p</code> gespeichert. Die Referenzen <strong>zwischen</strong> den Heap-Objekten bleiben unangetastet!"
            }
        ];

        let currentStep = 0;
        let lastStackSize = 0;

        const uiCode = document.getElementById('code-container');
        const uiStack = document.getElementById('stack-container');
        const uiHeap = document.getElementById('heap-container');
        const uiDesc = document.getElementById('explanation-text');
        const svgLayer = document.getElementById('arrows-container');
        
        function getBadgeClass(val) {
            if(val === '0xH1') return 'H1';
            if(val === '0xP1') return 'P1';
            if(val === '0xA1') return 'A1';
            if(val === 'null') return 'null';
            return '';
        }

        function formatValue(val) {
            const badge = getBadgeClass(val);
            if (badge) {
                return `<span class="ref-badge ${badge}">[${val}]</span>`;
            }
            
            // Highlight specific values that are not references
            if (val === '120.5' || val === '0.0') {
                return `<span class="val-badge">${val}</span>`;
            }
            
            return `<span class="text-emerald-400 font-bold">${val}</span>`;
        }

        function render() {
            const step = steps[currentStep];
            
            // Buttons und Texte
            document.getElementById('btn-prev').disabled = currentStep === 0;
            document.getElementById('btn-next').disabled = currentStep === steps.length - 1;
            document.getElementById('step-current').textContent = currentStep;
            document.getElementById('step-total').textContent = steps.length - 1;
            uiDesc.innerHTML = step.desc;

            // 1. Render Code
            uiCode.innerHTML = '';
            rawCode.forEach((lineHtml, index) => {
                const isActive = index === step.line;
                const lineDiv = document.createElement('div');
                lineDiv.className = `flex px-2 py-0.5 rounded transition-colors ${isActive ? 'line-active text-sky-50' : 'line-normal text-slate-300'}`;
                
                const numSpan = document.createElement('span');
                numSpan.className = 'w-8 shrink-0 text-right text-slate-600 mr-4 select-none font-code text-xs pt-1 border-r border-slate-700/50 pr-2';
                numSpan.textContent = index;
                
                const codeSpan = document.createElement('span');
                codeSpan.className = 'whitespace-pre font-code';
                codeSpan.innerHTML = isActive ? `<strong>${lineHtml}</strong>` : lineHtml;

                lineDiv.appendChild(numSpan);
                lineDiv.appendChild(codeSpan);
                uiCode.appendChild(lineDiv);
            });
            
            const activeLineEl = uiCode.querySelector('.line-active');
            if(activeLineEl) activeLineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // 2. Render Call Stack
            uiStack.innerHTML = '';
            const isPushing = step.stack.length > lastStackSize;

            if (step.stack.length === 0) {
                uiStack.innerHTML = `<div class="h-full flex items-center justify-center text-slate-600 text-sm italic">Call Stack leer</div>`;
            } else {
                step.stack.forEach((frame, index) => {
                    const isTop = index === step.stack.length - 1;
                    const el = document.createElement('div');
                    
                    let classes = `border rounded-xl overflow-hidden bg-slate-800 shrink-0 relative `;
                    if (isTop) {
                        classes += `border-sky-500/50 shadow-[0_0_15px_rgba(56,189,248,0.1)] ring-1 ring-sky-500/20 z-10 `;
                        if (isPushing) classes += `frame-push `;
                    } else {
                        classes += `border-slate-700/50 opacity-70 scale-[0.98] `;
                    }
                    el.className = classes;
                    el.id = `stack-${frame.id}`;

                    let html = `
                        <div class="${isTop ? 'bg-sky-500/10' : 'bg-slate-900'} px-4 py-2 border-b border-slate-700/50 flex justify-between items-center">
                            <span class="font-code font-bold ${isTop ? 'text-sky-300' : 'text-slate-400'}">${frame.name}</span>
                        </div>
                        <div class="p-3 flex flex-col gap-2">
                    `;

                    const varsKeys = Object.keys(frame.vars || {});
                    if (varsKeys.length > 0) {
                        varsKeys.forEach(k => {
                            html += `
                            <div id="stack-${frame.id}-${k}" class="flex justify-between items-center bg-slate-950/50 px-3 py-2 rounded border border-slate-700/50 relative">
                                <span class="font-code text-sm text-slate-300">${k}</span>
                                <span class="font-code text-sm">${formatValue(frame.vars[k])}</span>
                            </div>`;
                        });
                    } else {
                        html += `<span class="text-xs text-slate-500 italic">Keine Variablen</span>`;
                    }

                    html += `</div>`;
                    el.innerHTML = html;
                    uiStack.appendChild(el);
                });
            }
            lastStackSize = step.stack.length;

            // 3. Render Managed Heap
            uiHeap.innerHTML = '';
            const heapKeys = Object.keys(step.heap);
            
            if (heapKeys.length === 0) {
                uiHeap.innerHTML = `<div class="h-full w-full flex items-center justify-center text-slate-600 text-sm italic">Heap ist leer</div>`;
            } else {
                heapKeys.forEach(addr => {
                    const heapObj = step.heap[addr];
                    const badgeClass = getBadgeClass(addr);
                    
                    const el = document.createElement('div');
                    el.className = `border border-slate-700 rounded-xl overflow-hidden bg-slate-800 shrink-0 shadow-lg relative min-w-[200px] z-10`;
                    if(addr === "0xH1" && currentStep === 2) el.classList.add('item-enter');
                    if(addr === "0xP1" && currentStep === 4) el.classList.add('item-enter');
                    if(addr === "0xA1" && currentStep === 7) el.classList.add('item-enter');
                    
                    el.id = heapObj.id; // wichtig für SVG
                    
                    let html = `
                        <div class="bg-slate-950 px-3 py-2 border-b border-slate-800 flex justify-between items-center">
                            <span class="font-code text-xs text-slate-400">${heapObj.type}</span>
                            <span class="ref-badge ${badgeClass} text-xs font-code">[${addr}]</span>
                        </div>
                        <div class="p-3 flex flex-col gap-2">
                    `;

                    // Unterscheidung: Standardobjekt vs 2D-Array
                    if (heapObj.isArray) {
                        html += `<div class="font-code text-[11px] text-slate-500 text-center mb-1">string[2, 2]</div>
                                 <div class="grid grid-cols-2 gap-1 bg-slate-950 p-2 rounded border border-slate-700/50 relative" id="prop-${addr}-GitterData">`;
                        
                        heapObj.grid.forEach((row, r) => {
                            row.forEach((cell, c) => {
                                const isUpdated = heapObj.updated === `${r},${c}`;
                                html += `<div class="border border-slate-600/50 bg-slate-800 h-8 flex items-center justify-center text-sm rounded ${isUpdated ? 'cell-updated' : ''}">
                                            ${cell !== "" ? `<span>${cell}</span>` : `<span class="text-[10px] text-slate-600">[${r},${c}]</span>`}
                                         </div>`;
                            });
                        });
                        html += `</div>`;

                    } else {
                        // Standard Eigenschaften (Hamster, Plane)
                        const propKeys = Object.keys(heapObj.props);
                        propKeys.forEach(k => {
                            html += `
                            <div id="prop-${addr}-${k}" class="flex justify-between items-center bg-slate-950/30 px-3 py-1.5 rounded border border-slate-700/30 relative">
                                <span class="font-code text-[13px] text-slate-300">${k}</span>
                                <span class="font-code text-[13px]">${formatValue(heapObj.props[k])}</span>
                            </div>`;
                        });
                    }

                    html += `</div>`;
                    el.innerHTML = html;
                    uiHeap.appendChild(el);
                });
            }

            // 4. SVG Pfeile berechnen & zeichnen
            requestAnimationFrame(() => drawArrows(step.arrows));
        }

        function drawArrows(arrows) {
            svgLayer.innerHTML = ''; // Clear old arrows
            
            // Insert defs manually to keep them
            const defs = `
                <defs>
                    <marker id="arrow-stack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" /></marker>
                    <marker id="arrow-H1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f472b6" /></marker>
                    <marker id="arrow-P1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" /></marker>
                    <marker id="arrow-A1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24" /></marker>
                </defs>`;
            svgLayer.innerHTML = defs;

            if (!arrows || arrows.length === 0) return;

            arrows.forEach(arrow => {
                const elFrom = document.getElementById(arrow.from);
                const elTo = document.getElementById(arrow.to);

                if (!elFrom || !elTo) return;

                const rectFrom = elFrom.getBoundingClientRect();
                const rectTo = elTo.getBoundingClientRect();
                
                // Colors corresponding to target badges
                let color = "#38bdf8"; // default stack (Sky)
                let markerId = "arrow-stack";
                if(arrow.type === 'H1') { color = "#f472b6"; markerId = "arrow-H1"; } // Pink
                if(arrow.type === 'P1') { color = "#34d399"; markerId = "arrow-P1"; } // Emerald
                if(arrow.type === 'A1') { color = "#fbbf24"; markerId = "arrow-A1"; } // Amber

                let startX, startY, endX, endY, cp1x, cp1y, cp2x, cp2y;

                if (arrow.type === 'stack') {
                    // Von Stack (rechts) nach Heap (links/mitte)
                    startX = rectFrom.right - 5;
                    startY = rectFrom.top + (rectFrom.height / 2);
                    endX = rectTo.left - 2;
                    endY = rectTo.top + 20; // Top header des heap objects
                    
                    const dx = Math.abs(endX - startX);
                    cp1x = startX + (dx * 0.5);
                    cp1y = startY;
                    cp2x = endX - (dx * 0.5);
                    cp2y = endY;

                } else {
                    // Heap zu Heap (interne Referenzen)
                    startX = rectFrom.right - 5;
                    startY = rectFrom.top + (rectFrom.height / 2);
                    
                    if (arrow.from.includes('0xP1') && arrow.to.includes('0xH1')) {
                        // Plane -> Hamster (Rückwärts nach oben)
                        endX = rectTo.right - 5;
                        endY = rectTo.top + 20;
                        cp1x = startX + 80;
                        cp1y = startY;
                        cp2x = endX + 80;
                        cp2y = endY;
                    } else if (arrow.from.includes('0xH1') && arrow.to.includes('0xP1')) {
                        // Hamster -> Plane (Vorwärts nach unten)
                        endX = rectTo.left - 5;
                        endY = rectTo.top + 20;
                        cp1x = startX + 50;
                        cp1y = startY + 30;
                        cp2x = endX - 50;
                        cp2y = endY;
                    } else if (arrow.to.includes('0xA1')) {
                        // Plane -> Gitter Array (Nach unten)
                        endX = rectTo.left - 5;
                        endY = rectTo.top + 20;
                        cp1x = startX + 40;
                        cp1y = startY;
                        cp2x = endX - 40;
                        cp2y = endY;
                    }
                }

                // Generiere den SVG Path
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M ${startX} ${startY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endX} ${endY}`);
                path.setAttribute("class", "arrow-path");
                path.setAttribute("stroke", color);
                path.setAttribute("marker-end", `url(#${markerId})`);
                
                svgLayer.appendChild(path);
            });
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentStep < steps.length - 1) { currentStep++; render(); }
        });
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentStep > 0) { currentStep--; render(); }
        });
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight') document.getElementById('btn-next').click();
            if(e.key === 'ArrowLeft') document.getElementById('btn-prev').click();
        });

        // WICHTIG: Pfeile neu zeichnen, wenn das Fenster skaliert wird oder man in den Containern scrollt
        window.addEventListener('resize', () => requestAnimationFrame(() => drawArrows(steps[currentStep].arrows)));
        document.getElementById('stack-container').addEventListener('scroll', () => requestAnimationFrame(() => drawArrows(steps[currentStep].arrows)));
        document.getElementById('heap-container').addEventListener('scroll', () => requestAnimationFrame(() => drawArrows(steps[currentStep].arrows)));

        // Bootstrap
        render();
    </script>
</body>
</html>
