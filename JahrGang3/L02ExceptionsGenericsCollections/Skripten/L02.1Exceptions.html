<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Exceptions & Kontrollstrukturen – Schritt für Schritt</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-code: #0b1120;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-amber: #fbbf24;
            --accent-red: #f87171;
            --accent-purple: #c084fc;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header & Example Tabs */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 0.7rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .title-area h1 { font-size: 1.12rem; font-weight: 600; color: var(--text-main); }
        .title-area span { font-size: 0.78rem; color: var(--text-muted); }

        .tabs { display: flex; gap: 0.35rem; flex-wrap: wrap; }

        .tab-btn {
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.42rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            transition: all 0.2s;
        }

        .tab-btn:hover { color: var(--text-main); border-color: var(--accent-blue); }
        .tab-btn.active {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
            border-color: var(--accent-blue);
        }

        /* Mode Toggle Bar */
        .toggle-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border-color);
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
        }

        .toggle-bar.visible { display: flex; }

        .toggle-info {
            font-size: 0.83rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toggle-switch-btn {
            background-color: var(--accent-amber);
            color: var(--bg-dark);
            border: none;
            padding: 0.38rem 0.9rem;
            border-radius: 5px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-switch-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* Main Split Layout */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 52% 48%;
            overflow: hidden;
        }

        /* Left Side: Progressive Code Panel */
        .code-panel {
            background-color: var(--bg-code);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 0.55rem 1rem;
            background-color: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-container {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.48;
        }

        .code-block {
            opacity: 0.16;
            transition: all 0.3s ease;
            padding: 0.3rem 0.6rem;
            border-left: 3px solid transparent;
            margin-bottom: 0.4rem;
            border-radius: 0 4px 4px 0;
            white-space: pre;
        }

        .code-block.revealed { opacity: 0.78; }
        .code-block.active-step {
            opacity: 1;
            background-color: rgba(56, 189, 248, 0.12);
            border-left-color: var(--accent-blue);
        }
        .code-block.error-step {
            opacity: 1;
            background-color: rgba(248, 113, 113, 0.14);
            border-left-color: var(--accent-red);
        }
        .code-block.finally-step {
            opacity: 1;
            background-color: rgba(251, 191, 36, 0.14);
            border-left-color: var(--accent-amber);
        }
        .code-block.good-step {
            opacity: 1;
            background-color: rgba(74, 222, 128, 0.12);
            border-left-color: var(--accent-green);
        }

        /* Syntax Highlighting */
        .kw { color: #f472b6; font-weight: bold; }
        .tp { color: #38bdf8; }
        .mt { color: #fde047; }
        .st { color: #4ade80; }
        .cm { color: #64748b; font-style: italic; }

        /* Right Side: Pure Text Info Panel */
        .info-panel {
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .info-content {
            flex: 1;
            padding: 1.25rem 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        /* Keywords Bar */
        .keywords-section {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem 1.1rem;
        }

        .keywords-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .keyword-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .kw-pill {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            background-color: var(--bg-code);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
        }

        .kw-pill.new-kw {
            border-color: var(--accent-amber);
            color: var(--accent-amber);
            background-color: rgba(251, 191, 36, 0.1);
            font-weight: bold;
        }

        /* Text Explanation Cards */
        .text-section {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            border-radius: 8px;
            padding: 1.1rem 1.25rem;
            line-height: 1.55;
        }

        .text-section.warn-border { border-left-color: var(--accent-red); }
        .text-section.good-border { border-left-color: var(--accent-green); }
        .text-section.amber-border { border-left-color: var(--accent-amber); }

        .text-section h2 {
            font-size: 1.05rem;
            margin-bottom: 0.55rem;
            color: var(--text-main);
        }

        .text-section p {
            font-size: 0.9rem;
            color: #e2e8f0;
            margin-bottom: 0.65rem;
        }

        .text-section ul {
            padding-left: 1.25rem;
            font-size: 0.88rem;
            color: #cbd5e1;
        }

        .text-section li {
            margin-bottom: 0.4rem;
        }

        .text-section code {
            font-family: var(--font-mono);
            background-color: var(--bg-code);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            color: var(--accent-blue);
            font-size: 0.84rem;
        }

        /* Console / Logfile Text Output Preview */
        .console-output {
            background-color: #050811;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.85rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .console-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            display: block;
        }

        /* Footer Controls */
        footer {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 0.7rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .step-dots { display: flex; gap: 0.4rem; }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .dot.active { background-color: var(--accent-blue); transform: scale(1.25); }

        .controls { display: flex; gap: 0.75rem; align-items: center; }
        .btn {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.48rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.84rem;
            transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { border-color: var(--accent-blue); color: var(--accent-blue); }
        .btn.primary { background-color: var(--accent-blue); color: var(--bg-dark); border-color: var(--accent-blue); }
        .btn.primary:hover:not(:disabled) { background-color: #7dd3fc; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="title-area">
            <h1>C# Exceptions vs. Kontrollstrukturen</h1>
            <span>Schritt-für-Schritt Code-Aufbau & strukturierte Dokumentation</span>
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="tab-ex1" onclick="switchTab('ex1')">1) Standard: try / catch / finally</button>
            <button class="tab-btn" id="tab-ex2" onclick="switchTab('ex2')">2) Mehrere Exceptions & Anti-Patterns</button>
            <button class="tab-btn" id="tab-ex3" onclick="switchTab('ex3')">3) Eigene Exception & Ausgaben</button>
            <button class="tab-btn" id="tab-ex4" onclick="switchTab('ex4')">4) Parse vs. TryParse</button>
            <button class="tab-btn" id="tab-ex5" onclick="switchTab('ex5')">5) Roboter in Ecke (Logik)</button>
            <button class="tab-btn" id="tab-ex6" onclick="switchTab('ex6')">6) Roboter Achsbruch (Ausnahme)</button>
        </div>
    </div>

    <!-- Toggle Bar -->
    <div class="toggle-bar" id="toggle-bar">
        <div class="toggle-info" id="toggle-label">Ansicht: ...</div>
        <button class="toggle-switch-btn" id="toggle-btn" onclick="toggleVariant()">Wechseln</button>
    </div>
</header>

<main>
    <!-- LEFT: Progressive Code -->
    <section class="code-panel">
        <div class="panel-header">
            <span id="code-filename">Datei.cs</span>
            <span id="step-counter">Schritt 1 / 4</span>
        </div>
        <div class="code-container" id="code-container"></div>
    </section>

    <!-- RIGHT: Pure Text Info & Keyword List -->
    <section class="info-panel">
        <div class="panel-header">
            <span>Erklärung, Konzept & verwendete Keywords</span>
            <span id="mode-indicator" style="color: var(--accent-blue);">Standardfall</span>
        </div>
        <div class="info-content">
            <!-- Keywords used so far -->
            <div class="keywords-section">
                <div class="keywords-title">Bisher verwendete Keywords & Konstrukte in diesem Beispiel:</div>
                <div class="keyword-list" id="keyword-list"></div>
            </div>

            <!-- Main Text Explanation -->
            <div class="text-section" id="main-text-card">
                <h2 id="info-title">Titel</h2>
                <div id="info-body"></div>
            </div>

            <!-- Optional Console / Log Preview -->
            <div id="console-wrapper" style="display: none;">
                <span class="console-label" id="console-label">Konsolenausgabe / Compiler / Logfile:</span>
                <div class="console-output" id="console-output"></div>
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="step-dots" id="step-dots"></div>
    <div class="controls">
        <button class="btn" onclick="resetSteps()">↺ Reset</button>
        <button class="btn" id="btn-prev" onclick="changeStep(-1)">◀ Zurück</button>
        <button class="btn primary" id="btn-next" onclick="changeStep(1)">Next Step ▶</button>
    </div>
</footer>

<script>
    let currentTab = 'ex1';
    let currentVariant = 'A';
    let currentStep = 0;

    const examples = {
        // =====================================================================
        // BEISPIEL 1: Standardfall (throw, try, catch, finally)
        // =====================================================================
        ex1: {
            hasToggle: false,
            A: {
                filename: "SensorUeberwachung.cs",
                modeText: "Grundlagen: try / catch / finally",
                codeBlocks: [
                    `<span class="cm">// 1. Methode, die einen kritischen Zustand erkennt und wirft (throw)</span>\n<span class="kw">public static double</span> <span class="mt">LeseKesselDruck</span>(<span class="kw">double</span> bar) {\n    <span class="kw">if</span> (bar > 10.0) {\n        <span class="kw">throw new</span> <span class="tp">InvalidOperationException</span>(<span class="st">"Überdruck! Ventil blockiert."</span>);\n    }\n    <span class="kw">return</span> bar;\n}`,
                    `<span class="cm">// 2. Aufrufende Methode mit try-Block (Versuchsblock)</span>\n<span class="kw">public static void</span> <span class="mt">PruefeAnlage</span>() {\n    <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">"Öffne Sensor-Verbindung..."</span>);\n    <span class="kw">try</span> {\n        <span class="kw">double</span> druck = <span class="mt">LeseKesselDruck</span>(14.5);\n        <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">$"Druck OK: {druck} bar"</span>); <span class="cm">// Wird übersprungen!</span>\n    }`,
                    `    <span class="cm">// 3. catch-Block: Fängt den geworfenen Fehler ab</span>\n    <span class="kw">catch</span> (<span class="tp">InvalidOperationException</span> ex) {\n        <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">$"ALARM: {ex.Message}"</span>);\n        <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">"Leite Notabschaltung ein..."</span>);\n    }`,
                    `    <span class="cm">// 4. finally-Block: Aufräumarbeiten (läuft IMMER!)</span>\n    <span class="kw">finally</span> {\n        <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">"Schließe Sensor-Verbindung und gib Port frei."</span>);\n    }\n}`
                ],
                steps: [
                    {
                        revealed: [0], active: 0, style: "error-step",
                        keywords: ["throw", "new", "InvalidOperationException"],
                        newKeywords: ["throw", "InvalidOperationException"],
                        border: "warn-border",
                        title: "Schritt 1: Wann verwenden wir 'throw'?",
                        body: `<p>Die Methode <code>LeseKesselDruck(double bar)</code> hat eine klare Aufgabe: Einen gültigen Druckwert zurückzuliefern.</p>
                               <ul>
                                   <li>Bei einem Wert über <code>10.0</code> bar liegt ein gefährlicher Ausnahmezustand vor.</li>
                                   <li>Mit <code>throw new InvalidOperationException(...)</code> zieht die Methode die Reißleine: Die Ausführung von <code>LeseKesselDruck</code> bricht <strong>sofort</strong> ab.</li>
                                   <li>Das erzeugte Fehler-Objekt wird an die aufrufende Methode zurückgeschleudert.</li>
                               </ul>`,
                        console: null
                    },
                    {
                        revealed: [0, 1], active: 1, style: "active-step",
                        keywords: ["throw", "new", "InvalidOperationException", "try"],
                        newKeywords: ["try"],
                        border: "",
                        title: "Schritt 2: Der 'try'-Block (Kritischen Aufruf überwachen)",
                        body: `<p>In <code>PruefeAnlage()</code> öffnen wir zuerst die Verbindung zum Sensor und starten dann den <code>try</code>-Block.</p>
                               <ul>
                                   <li><code>try</code> umschließt Code, bei dem während der Laufzeit eine Exception auftreten könnte.</li>
                                   <li>Da wir <code>LeseKesselDruck(14.5)</code> übergeben, knallt es in dieser Zeile.</li>
                                   <li><strong>Wichtig:</strong> Alle weiteren Zeilen innerhalb des <code>try</code>-Blocks (wie <code>"Druck OK..."</code>) werden ab dem Zeitpunkt des Fehlers komplett übersprungen!</li>
                               </ul>`,
                        console: `Öffne Sensor-Verbindung...`
                    },
                    {
                        revealed: [0, 1, 2], active: 2, style: "error-step",
                        keywords: ["throw", "new", "InvalidOperationException", "try", "catch", "ex.Message"],
                        newKeywords: ["catch", "ex.Message"],
                        border: "warn-border",
                        title: "Schritt 3: Der 'catch'-Block (Reaktion auf den Ausnahmefall)",
                        body: `<p>Damit das Programm nicht abstürzt, fängt <code>catch (InvalidOperationException ex)</code> das geworfene Fehlerobjekt auf.</p>
                               <ul>
                                   <li>In der Variablen <code>ex</code> stecken alle Informationen über den Fehler (z. B. der Text in <code>ex.Message</code>).</li>
                                   <li>Der <code>catch</code>-Block wird <strong>nur dann</strong> betreten, wenn im <code>try</code>-Block tatsächlich ein passender Fehler geworfen wurde.</li>
                               </ul>`,
                        console: `Öffne Sensor-Verbindung...\nALARM: Überdruck! Ventil blockiert.\nLeite Notabschaltung ein...`
                    },
                    {
                        revealed: [0, 1, 2, 3], active: 3, style: "finally-step",
                        keywords: ["throw", "new", "InvalidOperationException", "try", "catch", "ex.Message", "finally"],
                        newKeywords: ["finally"],
                        border: "amber-border",
                        title: "Schritt 4: Wozu brauche ich 'finally'?",
                        body: `<p>Der <code>finally</code>-Block hat eine eiserne Garantie in C#: <strong>Er wird IMMER ausgeführt</strong> – völlig egal, ob:</p>
                               <ul>
                                   <li>alles gut ging (kein Fehler im <code>try</code>),</li>
                                   <li>ein Fehler auftrat und im <code>catch</code> behandelt wurde,</li>
                                   <li>oder sogar ein <code>return</code> mitten im <code>try</code> oder <code>catch</code> stand!</li>
                               </ul>
                               <p><strong>Wann brauche ich das?</strong> Immer dann, wenn externe Ressourcen (offene Dateien, Datenbank-Verbindungen, Netzwerk-Ports, Sperren) zwingend wieder geschlossen werden müssen, damit kein Speicherleck (Resource Leak) entsteht.</p>`,
                        console: `Öffne Sensor-Verbindung...\nALARM: Überdruck! Ventil blockiert.\nLeite Notabschaltung ein...\nSchließe Sensor-Verbindung und gib Port frei.`
                    }
                ]
            }
        },

        // =====================================================================
        // BEISPIEL 2: Mehrere Exceptions, Reihenfolge, when & Anti-Patterns
        // =====================================================================
        ex2: {
            hasToggle: true,
            toggleTextA: "Ansicht A: ✅ KORREKT (Mehrere Exceptions, Reihenfolge & 'when'-Filter)",
            toggleBtnA: "Wechsle zu Ansicht B: ❌ ANTI-PATTERNS (throw new Exception, catch(Exception) & throw ex)",
            toggleTextB: "Ansicht B: ❌ ANTI-PATTERNS (throw new Exception, Pokémon-Catch & StackTrace-Verlust)",
            toggleBtnB: "Zurück zu Ansicht A: ✅ KORREKT (Spezifische Exceptions & Reihenfolge)",
            A: {
                filename: "MehrereExceptionsUndFilter.cs",
                modeText: "✅ Best Practice: Catch-Kaskade & when-Logik",
                codeBlocks: [
                    `<span class="cm">// 1. Methode, die unterschiedliche, spezifische Exceptions werfen kann</span>\n<span class="kw">public static void</span> <span class="mt">SteuereRoboterArm</span>(<span class="kw">string</span>? dateiPfad, <span class="kw">int</span> winkel) {\n    <span class="kw">if</span> (dateiPfad == <span class="kw">null</span>)\n        <span class="kw">throw new</span> <span class="tp">ArgumentNullException</span>(<span class="kw">nameof</span>(dateiPfad), <span class="st">"Pfad fehlt!"</span>);\n    <span class="kw">if</span> (winkel < 0 || winkel > 180)\n        <span class="kw">throw new</span> <span class="tp">ArgumentOutOfRangeException</span>(<span class="kw">nameof</span>(winkel), winkel, <span class="st">"Nur 0-180° erlaubt!"</span>);\n    <span class="kw">if</span> (!<span class="tp">File</span>.<span class="mt">Exists</span>(dateiPfad))\n        <span class="kw">throw new</span> <span class="tp">FileNotFoundException</span>(<span class="st">"Kalibrierungsdatei nicht gefunden!"</span>, dateiPfad);\n}`,
                    `<span class="cm">// 2. try-Block & 1. Catch: Spezifischste Exception zuerst!</span>\n<span class="kw">try</span> {\n    <span class="mt">SteuereRoboterArm</span>(<span class="st">"kalibrierung.cfg"</span>, winkel: 250);\n}\n<span class="kw">catch</span> (<span class="tp">ArgumentNullException</span> ex) {\n    <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">$"Programmierfehler (Null): {ex.ParamName}"</span>);\n}`,
                    `<span class="cm">// 3. Logik-Abfrage direkt beim Catch mit 'when' (Exception Filter)</span>\n<span class="kw">catch</span> (<span class="tp">ArgumentOutOfRangeException</span> ex) <span class="kw">when</span> ((<span class="kw">int</span>)ex.ActualValue! > 180) {\n    <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">$"Winkel ({ex.ActualValue}°) zu groß -> Begrenze automatisch auf 180°!"</span>);\n}\n<span class="kw">catch</span> (<span class="tp">ArgumentException</span> ex) { <span class="cm">// Allgemeinere Basisklasse von ArgumentNull & OutOfRange!</span>\n    <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">$"Sonstiger Parameterfehler: {ex.Message}"</span>);\n}`,
                    `<span class="cm">// 4. Weitere spezifische Exceptions & allgemeinster Notfall-Catch ganz unten</span>\n<span class="kw">catch</span> (<span class="tp">FileNotFoundException</span> ex) {\n    <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">$"Datei '{ex.FileName}' fehlt -> Lade Standard-Kalibrierung."</span>);\n}\n<span class="kw">catch</span> (<span class="tp">Exception</span> ex) { <span class="cm">// MUSS immer ganz am Ende stehen!</span>\n    <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">$"Unerwarteter Systemfehler: {ex.Message}"</span>);\n    <span class="kw">throw</span>; <span class="cm">// Weiterwerfen an nächsthöhere Ebene (StackTrace bleibt erhalten!)</span>\n}`
                ],
                steps: [
                    {
                        revealed: [0], active: 0, style: "active-step",
                        keywords: ["ArgumentNullException", "ArgumentOutOfRangeException", "FileNotFoundException", "nameof"],

                    `    <span class="cm">// 3. Variante B: Im catch protokollieren UND durch neues Objekt beheben!</span>\n    <span class="kw">catch</span> (<span class="tp">AchsbruchException</span> ex) {\n        <span class="tp">File</span>.<span class="mt">AppendAllText</span>(<span class="st">"roboter_fehler.log"</span>, <span class="st">$"{DateTime.Now} | Reparatur nach: {ex.Message}\\n"</span>);\n        \n        <span class="cm">// Fehlerbehebung (Recovery): Neues Rad produzieren und zuweisen!</span>\n        bot.AntriebsRad = <span class="mt">ProduziereErsatzRad</span>();\n        <span class="tp">Console</span>.<span class="mt">WriteLine</span>(<span class="st">"Neues Rad montiert! Setze Fahrt fort..."</span>);\n        bot.<span class="mt">BewegeVorwaerts</span>(); <span class="cm">// Jetzt klappt es!</span>\n    }\n}`
                ],
                steps: [
                    {
                        revealed: [0], active: 0, style: "good-step",
                        keywords: ["new Rad", "return"],
                        newKeywords: ["new Rad"],
                        border: "good-border",
                        title: "Schritt 1: Eine Hilfsfunktion zur Schadensbehebung bereitstellen",
                        body: `<p>In dieser Ausbaustufe besitzt unsere Fertigungsstraße eine automatische Reparaturstation: Die Methode <code>ProduziereErsatzRad()</code> erstellt mit <code>new Rad()</code> ein völlig neues, intaktes Rad-Objekt und gibt es zurück.</p>`,
                        console: null
                    },
                    {
                        revealed: [0, 1], active: 1, style: "error-step",
                        keywords: ["new Rad", "return", "try", "AchsbruchException"],
                        newKeywords: ["try", "AchsbruchException"],
                        border: "warn-border",
                        title: "Schritt 2: Der Achsbruch wirft die Exception",
                        body: `<p>Genau wie in Variante A bricht im <code>try</code>-Block die Achse und <code>bot.BewegeVorwaerts()</code> wirft die <code>AchsbruchException</code>.</p>`,
                        console: null
                    },
                    {
                        revealed: [0, 1, 2], active: 2, style: "good-step",
                        keywords: ["new Rad", "return", "try", "catch", "File.AppendAllText", "bot.AntriebsRad = ..."],
                        newKeywords: ["catch", "File.AppendAllText", "bot.AntriebsRad = ..."],
                        border: "good-border",
                        title: "Schritt 3: Variante B – Im 'catch' das defekte Objekt austauschen!",
                        body: `<p>Jetzt zeigt sich die volle Stärke einer sauberen Fehlerbehandlung (<strong>Error Recovery / Kompensation</strong>):</p>
                               <ul>
                                   <li>Wir schreiben den Vorfall zuerst mit <code>File.AppendAllText(...)</code> in unser Logfile, damit die Wartungshistorie stimmt.</li>
                                   <li>Danach rufen wir <code>bot.AntriebsRad = ProduziereErsatzRad();</code> auf und ersetzen die kaputte Referenz durch das neue Objekt.</li>
                                   <li><strong>Fazit:</strong> Sowohl Variante A (Loggen & sicherer Stopp, wenn keine Reparatur möglich ist) als auch Variante B (Loggen & Zustand durch Kompensationslogik reparieren) sind in der Softwarearchitektur <strong>vollkommen korrekt</strong>!</li>
                               </ul>`,
                        console: `Werkstatt-Arm fertigt neues Ersatzrad...\nNeues Rad montiert! Setze Fahrt fort...\n\n[Eintrag in "roboter_fehler.log"]:\n23.10.2026 10:26:00 | Reparatur nach: Antriebsachse während der Fahrt gebrochen!`
                    }
                ]
            }
        }
    };

    function switchTab(tabId) {
        currentTab = tabId;
        currentVariant = 'A';
        currentStep = 0;

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');

        updateUI();
    }

    function toggleVariant() {
        currentVariant = (currentVariant === 'A') ? 'B' : 'A';
        currentStep = 0;
        updateUI();
    }

    function changeStep(delta) {
        const steps = examples[currentTab][currentVariant].steps;
        const next = currentStep + delta;
        if (next >= 0 && next < steps.length) {
            currentStep = next;
            updateUI();
        }
    }

    function resetSteps() {
        currentStep = 0;
        updateUI();
    }

    function jumpToStep(idx) {
        currentStep = idx;
        updateUI();
    }

    function updateUI() {
        const tabObj = examples[currentTab];
        const data = tabObj[currentVariant];
        const step = data.steps[currentStep];

        // Toggle Bar visibility
        const toggleBar = document.getElementById('toggle-bar');
        if (tabObj.hasToggle) {
            toggleBar.classList.add('visible');
            document.getElementById('toggle-label').textContent = (currentVariant === 'A') ? tabObj.toggleTextA : tabObj.toggleTextB;
            document.getElementById('toggle-btn').textContent = (currentVariant === 'A') ? tabObj.toggleBtnA : tabObj.toggleBtnB;
        } else {
            toggleBar.classList.remove('visible');
        }

        // Header counters
        document.getElementById('code-filename').textContent = data.filename;
        document.getElementById('step-counter').textContent = `Schritt ${currentStep + 1} / ${data.steps.length}`;
        document.getElementById('mode-indicator').textContent = data.modeText;

        // Left: Code blocks
        const codeContainer = document.getElementById('code-container');
        codeContainer.innerHTML = data.codeBlocks.map((block, idx) => {
            let classes = ['code-block'];
            if (step.revealed.includes(idx)) classes.push('revealed');
            if (step.active === idx) classes.push(step.style || 'active-step');
            return `<div class="${classes.join(' ')}">${block}</div>`;
        }).join('');

        // Right: Keyword pills
        const kwContainer = document.getElementById('keyword-list');
        kwContainer.innerHTML = step.keywords.map(kw => {
            const isNew = step.newKeywords && step.newKeywords.includes(kw);
            return `<span class="kw-pill ${isNew ? 'new-kw' : ''}">${kw}</span>`;
        }).join('');

        // Right: Text explanation
        const textCard = document.getElementById('main-text-card');
        textCard.className = 'text-section ' + (step.border || '');
        document.getElementById('info-title').textContent = step.title;
        document.getElementById('info-body').innerHTML = step.body;

        // Right: Optional Console / Logfile Output
        const consoleWrapper = document.getElementById('console-wrapper');
        const consoleOutput = document.getElementById('console-output');
        if (step.console) {
            consoleWrapper.style.display = 'block';
            consoleOutput.innerHTML = step.console;
        } else {
            consoleWrapper.style.display = 'none';
        }

        // Footer Dots & Buttons
        const dotsContainer = document.getElementById('step-dots');
        dotsContainer.innerHTML = data.steps.map((_, idx) =>
            `<div class="dot ${idx === currentStep ? 'active' : ''}" onclick="jumpToStep(${idx})"></div>`
        ).join('');

        document.getElementById('btn-prev').disabled = currentStep === 0;
        document.getElementById('btn-next').disabled = currentStep === data.steps.length - 1;
    }

    // Start
    updateUI();
</script>
</body>
</html>
